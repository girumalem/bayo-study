name: Make beat tracks
on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Which levels (all, or a list like bi1,al3,wh4)"
        required: true
        default: "bi1"
      vocal:
        description: "Voice style for the rapper"
        required: false
        default: "clear male rap vocals"
      line_ms:
        description: "Milliseconds per lyric line (bigger = slower)"
        required: false
        default: "5000"
      redo:
        description: "Make new versions even if a track already exists"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency: make-audio
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Make tracks
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LEVELS: ${{ inputs.levels }}
          VOCAL: ${{ inputs.vocal }}
          LINE_MS: ${{ inputs.line_ms }}
          REDO: ${{ inputs.redo }}
        run: python tools/make_music.py
      - name: Save the tracks to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/audio/beat || true
          git commit -m "Make beat tracks" || echo "Nothing new to save"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
