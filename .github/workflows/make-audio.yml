name: Make voice audio
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: "ElevenLabs voice ID for lessons"
        required: true
      beat_voice_id:
        description: "Voice ID for the raps (leave empty to use the same voice)"
        required: false
        default: ""
      model:
        description: "Voice model"
        required: true
        default: "eleven_multilingual_v2"
        type: choice
        options: ["eleven_multilingual_v2", "eleven_flash_v2_5"]
      source:
        description: "Record new audio, or download clips you already made from your ElevenLabs History (free)"
        required: true
        default: "record"
        type: choice
        options: ["record", "recover from History"]
      max_chars:
        description: "Stop after this many characters (0 = record everything)"
        required: false
        default: "0"
permissions:
  contents: write
concurrency: make-audio
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 mutagen==1.47.0
      - name: Record lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
          BEAT_VOICE_ID: ${{ inputs.beat_voice_id }}
          MAX_CHARS: ${{ inputs.max_chars }}
          MODEL_ID: ${{ inputs.model }}
          FROM_HISTORY: ${{ inputs.source == 'recover from History' }}
        run: python tools/make_audio.py
      - name: Save the audio to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git commit -m "Record voice audio" || echo "Nothing new to save"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: Keep a backup copy of the audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-audio
          path: public/audio
          retention-days: 30
