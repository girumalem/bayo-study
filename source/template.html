<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0f6">
<title>Bayo's Study Court</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<style>
/* Layout: one thing at a time. Court-floor scoreboard on top, big tap targets, audio on everything.
   Readability: Lexend, large size, wide line + letter spacing, no italics, soft blue-gray paper (not pure white). */
:root{
  --bg:#eaf0f6; --card:#f8fafc; --ink:#1c2430; --muted:#566273; --line:#c9d3df;
  --accent:#e2681f; --accent-ink:#ffffff; --navy:#1d3557;
  --good:#1d7a4c; --good-bg:#dcf1e5; --bad:#b4421d; --bad-bg:#fbe5da;
  --noun:#2563c9; --verb:#c93a52; --adj:#1f8a52; --adv:#7b4bc0; --pron:#0d7f8a; --other:#7a8494;
  --font:"Lexend",Verdana,Tahoma,system-ui,sans-serif;
  --size:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a22; --card:#1c2430; --ink:#eef2f7; --muted:#a6b1c0; --line:#323e4e;
  --accent:#f0823a; --accent-ink:#1a0d03; --navy:#9cc3ee;
  --good:#6fd39b; --good-bg:#143726; --bad:#f39a72; --bad-bg:#3d2116;
  --noun:#7fb0ff; --verb:#ff8197; --adj:#6fd39b; --adv:#c3a1f7; --pron:#62d3dd; --other:#9aa4b2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a22; --card:#1c2430; --ink:#eef2f7; --muted:#a6b1c0; --line:#323e4e;
  --accent:#f0823a; --accent-ink:#1a0d03; --navy:#9cc3ee;
  --good:#6fd39b; --good-bg:#143726; --bad:#f39a72; --bad-bg:#3d2116;
  --noun:#7fb0ff; --verb:#ff8197; --adj:#6fd39b; --adv:#c3a1f7; --pron:#62d3dd; --other:#9aa4b2; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--size);line-height:1.7;letter-spacing:.02em;word-spacing:.08em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;line-height:1.2;letter-spacing:0}
.brand svg{flex:none}
.board{display:flex;gap:8px;align-items:stretch;background:var(--navy);color:var(--bg);border-radius:12px;padding:6px 12px;font-weight:700}
.board div{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px}
.board b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent)}
.board small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.iconbtn svg{width:24px;height:24px}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;line-height:1.25;letter-spacing:0}
h1{font-size:28px;font-weight:800}
h2{font-size:24px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:16px}

/* home */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.unit{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.unit:hover{border-color:var(--accent)}
.unit .num{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.unit .nm{font-size:20px;font-weight:800;line-height:1.3}
.stars{font-size:22px;letter-spacing:.15em;color:var(--line)} .stars .on{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* season map */
.rankcard{display:flex;gap:16px;align-items:center}
.rankbadge{flex:none;width:72px;height:72px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.rankbadge svg{width:56px;height:56px}
.rankname{font-size:26px;font-weight:800;line-height:1.2}
.xp{height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.xp i{display:block;height:100%;background:var(--accent);border-radius:8px}
.map{display:flex;flex-direction:column;align-items:stretch;padding:4px 0}
.stop{display:flex;align-items:center;gap:14px;width:min(100%,430px)}
.stop.r{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.stop.l{align-self:flex-start}
.link{height:46px;width:100%;display:block}
.link path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round}
.link.done path{stroke:var(--accent)}
.node{position:relative;flex:none;width:112px;height:112px;border-radius:50%;border:5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.node svg{width:84px;height:84px}
.node.open{border-color:var(--accent)}
.node.won{border-color:var(--good)}
.node.locked{background:var(--bg);border-style:dashed}
.node.locked .art{opacity:.25;filter:grayscale(1)}
.node .lockic{position:absolute;inset:0;display:grid;place-items:center}
.node .lockic svg{width:52px;height:52px}
.node.boss{width:132px;height:132px;border-width:6px}
.node.boss svg{width:100px;height:100px}
.lvnum{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);font-weight:800;font-size:14px;border-radius:10px;padding:2px 10px;white-space:nowrap}
.here{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.08em;border-radius:10px;padding:3px 10px;white-space:nowrap}
.here::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.here{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-5px)}}}
.stopinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.stopinfo .nm{font-size:20px;font-weight:800;line-height:1.25}
.stopinfo .st{font-size:15px;font-weight:700;color:var(--muted)}
.stop.r .stars{text-align:right}
.lvhead{display:flex;align-items:center;gap:14px}
.lvhead svg{flex:none;width:72px;height:72px}
/* celebration */
.celebrate{position:relative;overflow:hidden;align-items:center;text-align:center}
.celebrate .big svg{width:150px;height:150px}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;top:-12px;width:10px;height:16px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){.burst i{animation:fall 1.8s ease-in forwards}@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}}
.unlock{border:3px solid var(--accent);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.unlock svg{flex:none;width:72px;height:72px}
.unlock b{font-size:21px;display:block}
.pill{display:inline-block;background:var(--navy);color:var(--bg);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.subj{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;min-height:120px}
.subj:hover{border-color:var(--accent)}
.subj svg{flex:none;width:76px;height:76px}
.subj .nm{font-size:22px;font-weight:800;line-height:1.2;display:block}
.subj .st{font-size:15px;font-weight:700;color:var(--muted);display:block;margin:2px 0 6px}
.subj .xp{margin-top:0}
/* worked steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{font-size:26px;font-weight:700;line-height:1.35;padding:8px 14px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.step.new{border-color:var(--accent)}
.mathline{font-size:30px;font-weight:700;line-height:1.35;padding:10px 16px;border-radius:14px;background:var(--bg);border:2px solid var(--line);align-self:flex-start;max-width:100%}
.reading{outline:4px solid var(--accent);outline-offset:3px;border-radius:10px}
/* visuals */
.vis{display:flex;justify-content:center}
.vis svg.graph{width:100%;max-width:300px;height:auto}
.graph .grid{stroke:var(--line);stroke-width:1}
.graph .ax{stroke:var(--ink);stroke-width:2}
.graph text{font:700 11px Lexend,sans-serif;fill:var(--muted)}
.pun{border-collapse:separate;border-spacing:6px;font-size:26px;font-weight:800}
.pun th{width:72px;height:56px;color:var(--navy);font-size:22px}
.pun td{width:72px;height:64px;text-align:center;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.pun td.dom{color:var(--verb)} .pun td.rec{color:var(--noun)}
.pun caption{caption-side:bottom;font-size:15px;font-weight:700;color:var(--muted);padding-top:6px}
/* order questions */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slots li{counter-increment:s;display:flex;align-items:center;gap:12px;min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:0 12px;font-size:20px;font-weight:600}
.slots li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-size:16px;font-weight:800}
.slots li button{flex:1;text-align:left;border:0;background:transparent;font:inherit;min-height:52px;padding:0}
.slots li.filled{border-style:solid;border-color:var(--navy)}
.slots li.ok{border-color:var(--good);background:var(--good-bg)} .slots li.no{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-direction:column;gap:8px}
.pool button{text-align:left;min-height:56px;border:2px solid var(--accent);border-radius:14px;background:var(--card);padding:8px 14px;font-size:20px;font-weight:700}
.olist{margin:0;padding-left:28px;font-size:19px;font-weight:600;display:flex;flex-direction:column;gap:4px}

/* word chips (colour + label, never colour alone) */
.sent{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-end;font-size:24px;line-height:1.3}
.w{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:10px;border:2px solid transparent;background:transparent}
.w .t{font-weight:600}
.w .lb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.w.n{border-color:var(--noun)} .w.n .t,.w.n .lb{color:var(--noun)}
.w.v{border-color:var(--verb)} .w.v .t,.w.v .lb{color:var(--verb)}
.w.a{border-color:var(--adj)} .w.a .t,.w.a .lb{color:var(--adj)}
.w.r{border-color:var(--adv)} .w.r .t,.w.r .lb{color:var(--adv)}
.w.p{border-color:var(--pron)} .w.p .t,.w.p .lb{color:var(--pron)}
.w.plain .lb{visibility:hidden}
.w.punct{padding:4px 0;margin-left:-6px}
.w.punct .lb{visibility:hidden}
.w.speaking{background:var(--accent);border-color:var(--accent)} .w.speaking .t,.w.speaking .lb{color:var(--accent-ink)}
button.w{border-color:var(--line);background:var(--card);min-height:56px;min-width:48px;justify-content:center}
button.w .lb{visibility:hidden}
button.w:hover{border-color:var(--ink)}
button.w.pick-ok{background:var(--good-bg);border-color:var(--good)}
button.w.pick-bad{background:var(--bad-bg);border-color:var(--bad)}

/* readable text with spoken-word highlight */
.say span.cur{background:var(--accent);color:var(--accent-ink);border-radius:4px}
.tip{border-left:6px solid var(--accent);padding:6px 0 6px 14px;font-weight:500}
.ul{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px;text-decoration-color:var(--accent);font-weight:700}
.sentence{font-size:24px;line-height:1.6}

/* buttons */
.btn{min-height:56px;border-radius:14px;padding:0 22px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.listen{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 18px;border-radius:14px;border:2px solid var(--navy);background:transparent;font-weight:800;font-size:18px;color:var(--navy)}
.listen svg{width:26px;height:26px}
.listen.playing{background:var(--navy);color:var(--bg)}

/* choices */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:stretch;gap:0;border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.opt .pick{flex:1;text-align:left;border:0;background:transparent;padding:12px 16px;min-height:60px;font-size:21px;font-weight:600;display:flex;gap:14px;align-items:center}
.opt .letter{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:16px;font-weight:800}
.opt .hear{border:0;border-left:2px solid var(--line);background:transparent;width:64px;display:grid;place-items:center;color:var(--navy)}
.opt .hear svg{width:26px;height:26px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt .pick:disabled{cursor:default;color:inherit}

/* feedback */
.fb{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.fb.ok{border-color:var(--good);background:var(--good-bg)}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb .head{font-weight:800;font-size:22px}
.prog{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.cur{background:var(--navy)}

/* settings */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:10px 16px;font-weight:700;font-size:16px;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
select{font:inherit;font-size:16px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;max-width:100%}
label.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;min-height:48px}
label.chk input{width:24px;height:24px;accent-color:var(--accent)}
.notice{font-size:16px;border:2px dashed var(--line);border-radius:12px;padding:10px 14px}
@media (max-width:480px){:root{--size:19px}.sent{font-size:22px}.brand{font-size:19px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
/* ===== new-style lessons (v-*) ===== */
:root{--blue:#2463b5;--cyto:#fdf3d7;--mem:#d98a1f;--nuc:#7b5cc4;--mito:#e2681f;--ribo:#1d3557;--chl:#2f9a4d;--vac:#7fb8e6;--wall:#7a8b3a;--bark-l:#d9cfbf;--bark-d:#3b3530}
@media (prefers-color-scheme:dark){:root{--blue:#7fb2f0;--cyto:#3a3320;--mem:#f0a94a;--nuc:#b39cf0;--mito:#f0823a;--ribo:#cfe0f5;--chl:#6fd39b;--vac:#5c8fbf;--wall:#b9c96a;--bark-l:#cfc4b2;--bark-d:#2a2522}}
.v-track{display:flex;gap:4px}
.v-track button{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 0;cursor:pointer}
.v-track i{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:21px;background:var(--card)}
.v-track .on{color:var(--ink)} .v-track .on i{border-color:var(--accent);background:var(--accent)}
.v-track .done i{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.v-stage{position:relative;border-radius:18px;background:var(--bg);border:2px solid var(--line);overflow:hidden;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.v-stage > svg.v-scene{display:block;width:100%;height:auto}
.v-cap{min-height:64px;font-size:24px;font-weight:700;line-height:1.35;text-align:center;padding:4px 8px}
.v-cap .k,.v-prompt .k{color:var(--accent)}
.v-center{justify-content:center}
.v-big{min-height:72px!important;font-size:22px!important;padding:0 26px!important}
.v-part{transition:opacity .7s ease, transform .7s ease;transform-box:fill-box;transform-origin:center}
.v-part.off{opacity:0;transform:scale(.5);pointer-events:none}
.v-part.dim{opacity:.25}
.v-part.glow{filter:drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 4px var(--accent))}
@media (prefers-reduced-motion:no-preference){.v-part.glow{animation:vpulse 1.2s ease-in-out infinite}@keyframes vpulse{50%{transform:scale(1.08)}}
  .v-pop{animation:vpop .5s ease both}@keyframes vpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}}
.v-part.right{filter:drop-shadow(0 0 10px var(--good)) drop-shadow(0 0 4px var(--good))}
.v-part.wrong{filter:drop-shadow(0 0 10px var(--bad))}
.v-tappable .v-part{cursor:pointer}
.v-bubble{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--card);border:3px solid var(--accent);border-radius:16px;padding:8px 16px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:94%}
.v-bubble svg{width:34px;height:34px;flex:none}
.v-emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.v-erow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font-size:64px;padding:16px 4px}
.v-erow.many{font-size:46px}
.v-bigtxt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
.v-bigtxt div{font-size:34px;font-weight:800;letter-spacing:.03em;text-align:center}
.v-bigtxt div:last-child{color:var(--accent)}
/* balance */
.v-bal{width:100%;max-width:440px}
.v-bal text{font:800 22px Lexend,sans-serif;fill:var(--ink)}
.v-bal .act{font-size:18px;fill:var(--accent)}
/* timeline */
.v-tl{display:flex;flex-direction:column;gap:6px;width:100%}
.v-tl button{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:18px;padding:6px 12px;text-align:left;cursor:pointer;min-height:54px}
.v-tl button b{font-size:20px;min-width:56px;color:var(--navy)}
.v-tl button .v-emo{font-size:28px}
.v-tl button.hi{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.v-tl button.dimmed{opacity:.55}
/* chain, pyramid, acronym */
.v-chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:10px}
.v-chain .n{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:15px;padding:6px 8px;border-radius:14px;border:3px solid transparent}
.v-chain .n .v-emo{font-size:46px}
.v-chain .n.hi{border-color:var(--accent);background:var(--card)}
.v-chain .ar{font-size:26px;color:var(--muted)}
.v-pyr{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="var(--accent)"/><path d="M2 18h32M18 2v32M7 6c5 4 5 20 0 24M29 6c-5 4-5 20 0 24" fill="none" stroke="var(--navy)" stroke-width="2"/></svg>
      <span>Bayo's Study Court</span>
    </div>
    <div class="row" style="gap:8px">
      <div class="board" aria-label="Scoreboard"><div><b id="pts">0</b><small>Points</small></div><div><b id="streak">0</b><small>Streak</small></div><div><b id="rankShort" style="font-size:16px;line-height:1.9">Rookie</b><small>Rank</small></div></div>
      <button class="iconbtn" id="setBtn" aria-label="Sound settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Sound</button>
    </div>
  </header>

  <section class="card" id="settings" hidden>
    <h2>Sound settings</h2>
    <div class="row"><span style="font-weight:700">Speed</span><div class="seg" id="speed"><button data-r="0.75">Slow</button><button data-r="0.9">Normal</button><button data-r="1.1">Fast</button></div></div>
    <label class="chk"><input type="checkbox" id="auto"> Read each question out loud automatically</label>
    <label class="chk"><input type="checkbox" id="sfx"> Game sounds (cheer when you get it right)</label>
    <div class="row"><span style="font-weight:700">Voice</span><select id="voice" aria-label="Voice"></select></div>
    <div class="row"><button class="listen" id="testVoice"></button></div>
    <p class="notice" id="noTTS" hidden>This browser can't read out loud. Try Chrome, Safari, or Edge.</p>
  </section>

  <main id="view"></main>
</div>
<script>
const SUBJ = __SUBJ__;
let SUB = SUBJ[0], UNITS = SUB.units;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const TAGS = {n:["noun","a person, place, thing, or idea"],v:["verb","an action, what someone does"],a:["adjective","a word that describes a noun"],r:["adverb","a word that tells how, when, or where"],p:["pronoun","a word that takes the place of a noun"],d:["article","a little word like a, an, or the"],o:["preposition","a word that shows where or when, like in, on, or at"],c:["conjunction","a joining word like and, but, or so"],w:["word",""],x:["",""]};
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const CHEERS_OK = ["Bucket!","Nothing but net, Bayo.","Touchdown!","That's a three.","Clutch, Bayo.","Money.","That's my guy, Bayo.","Bars. Straight bars."];
const CHEERS_NO = ["Close, Bayo. Check the replay.","Not this time. Watch the replay.","Good try. Here's the play.","Shake it off, Bayo. Here's the play."];

/* ---------- saved progress (this device only) ---------- */
const KEY = "bayo-grammar-v1";
let S = {points:0, streak:0, best:{}, seen:{}, rate:0.9, auto:false, voice:"", days:{}, sfx:true, sub:"", miss:[]};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const today = () => { const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
function paintBoard(){ $("pts").textContent = S.points; $("streak").textContent = S.streak; $("rankShort").textContent = rankOf(S.points).r.name.split(" ")[0]; }
/* ---------- ranks ---------- */
const RANKS = [{name:"Rookie",at:0},{name:"Starter",at:40},{name:"All-Star",at:100},{name:"MVP",at:200},{name:"Hall of Famer",at:350},{name:"Legend",at:600},{name:"GOAT",at:1000}];
function rankOf(p){ let i = 0; RANKS.forEach((r,k) => { if (p >= r.at) i = k; }); return {i, r:RANKS[i], next:RANKS[i+1]||null}; }
/* ---------- game sounds (short tones, no files) ---------- */
let actx = null;
function tone(notes){ if (!S.sfx) return; try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); let t = actx.currentTime;
  notes.forEach(([f,d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02); t += d*0.8; }); } catch(e) {} }
const SFX = { ok:()=>tone([[660,.12],[990,.2]]), no:()=>tone([[330,.18],[262,.25]]), win:()=>tone([[523,.14],[659,.14],[784,.14],[1047,.35]]) };

/* ---------- read aloud ---------- */
const synth = window.speechSynthesis || null;
let voices = [], voice = null, speakingBtn = null;
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  const rank = v => (/natural|neural|enhanced|premium|siri/i.test(v.name)?4:0) + (/google us|samantha|aria|jenny|guy|alex|daniel/i.test(v.name)?2:0) + (/en-US/i.test(v.lang)?1:0);
  voices.sort((a,b) => rank(b) - rank(a));
  voice = voices.find(v => v.name === S.voice) || voices[0] || null;
  $("voice").innerHTML = voices.map(v => `<option ${voice&&v.name===voice.name?"selected":""}>${esc(v.name)}</option>`).join("") || "<option>Default voice</option>";
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; } else { $("noTTS").hidden = false; }

function clearHighlights(){ document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading")); document.querySelectorAll(".cur").forEach(e=>e.classList.remove("cur")); document.querySelectorAll(".w.speaking").forEach(e=>e.classList.remove("speaking")); if (speakingBtn) speakingBtn.classList.remove("playing"); speakingBtn = null; }
function stop(){ if (synth) synth.cancel(); clearHighlights(); }
/* speak(text, spans?) — spans: elements each with data-o (char offset in text) for word highlighting */
function speak(text, spans, btn){
  if (!synth) return;
  stop();
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.rate = S.rate; if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-US";
  let list = spans ? [...spans] : [];
  if (list.length && changes(text)) { const box = list[0].closest(".say,.sent,.step,.mathline") || list[0].parentElement; list = []; if (box) box.classList.add("reading"); }
  u.onboundary = e => { if (!list.length || e.name === "sentence") return; let hit = null; for (const s of list) { if (+s.dataset.o <= e.charIndex) hit = s; else break; }
    list.forEach(s => s.classList.remove("cur","speaking")); if (hit) hit.classList.add(hit.classList.contains("w")?"speaking":"cur"); };
  u.onend = u.onerror = () => clearHighlights();
  if (btn) { speakingBtn = btn; btn.classList.add("playing"); }
  synth.speak(u);
}
/* Turn plain text into word spans that can be highlighted while spoken */
function spansFrom(text, base){ let o = base||0, out = ""; for (const part of text.split(/(\s+)/)) { if (!part) continue; if (/^\s+$/.test(part)) { out += part; o += part.length; continue; } out += `<span data-o="${o}">${esc(part)}</span>`; o += part.length; } return out; }
function sayHTML(text){ return `<span class="say">${spansFrom(text,0)}</span>`; }
function speakEl(el, btn){ const spans = el.querySelectorAll("[data-o]"); const text = el.dataset.text || el.textContent; speak(text, spans, btn); }
function listenBtn(label, id){ return `<button class="listen" ${id?`id="${id}"`:""}>${SPK}<span>${label}</span></button>`; }

/* ---------- tagged sentences ---------- */
const SUP = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9"};
function mathSpeak(t){
  t = t.replace(/([A-Za-z0-9)])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (m,b,p) => { const n = [...p].map(c=>SUP[c]).join(""); return b + (n==="2"?" squared":n==="3"?" cubed":n==="0"?" to the zero power":" to the "+n+(n==="1"?"st":"th")+" power"); })
   .replace(/ˣ/g," to the x power")
   .replace(/\((−?[\d.]+), (−?[\d.]+)\)/g,"the point $1, $2")
   .replace(/\b([fgh])\(([^)]+)\)/g,"$1 of $2")
   .replace(/(\d)\(/g,"$1 times (").replace(/\)\(/g,") times (").replace(/([a-z])\(/g,"$1 times (")
   .replace(/(^|[\s(,{=])−(?=[\dA-Za-z])/g,"$1negative ")
   .replace(/−/g," minus ").replace(/≤/g," is less than or equal to ").replace(/≥/g," is greater than or equal to ")
   .replace(/ < /g," is less than ").replace(/ > /g," is greater than ").replace(/=/g," equals ")
   .replace(/÷/g," divided by ").replace(/[×·]/g," times ").replace(/(\w)\/(\w)/g,"$1 over $2")
   .replace(/ \+ /g," plus ").replace(/(\d)([a-z])\b/g,"$1 $2")
   .replace(/→/g," gives ").replace(/[{}]/g,"").replace(/[()]/g,", ");
  return t;
}
function geneSpeak(t){
  t = t.replace(/(^|[\s"])B(?=[\s".,?]|$)/g,"$1big B").replace(/(^|[\s"])([bt])(?=[\s".,?]|$)/g,(m,p,l)=>`${p}little ${l.toUpperCase()}`);
  return t.replace(/\b([A-Za-z])([A-Za-z])\b/g,(m,a,b)=> a.toLowerCase()===b.toLowerCase() ? `${a===a.toUpperCase()?"big":"little"} ${a.toUpperCase()}, ${b===b.toUpperCase()?"big":"little"} ${b.toUpperCase()}` : m);
}
const spoken = t => { t = t.replace(/(^|\s)-ly\b/g,"$1L Y").replace(/(^|\s)-ed\b/g,"$1E D");
  if (SUB.id === "al") t = mathSpeak(t); if (SUB.id === "bi") t = geneSpeak(t);
  return t.replace(/\s+/g," ").replace(/ ,/g,",").replace(/,\s*,/g,",").trim(); };
const changes = t => SUB.id !== "gr" && spoken(t) !== t.replace(/\s+/g," ").trim();
const toks = s => s.split(" ").map(t => { const i = t.lastIndexOf("/"); return {w:t.slice(0,i), tag:t.slice(i+1)}; });
function sentenceText(s){ return toks(s).map(t=>t.w).join(" ").replace(/ ([.,!?;:])/g,"$1"); }
function chipsHTML(s, mode){ // mode: "show" colours all, "tap" plain buttons
  let o = 0; const text = sentenceText(s);
  return toks(s).map((t,i) => {
    const idx = text.indexOf(t.w, o); if (idx >= 0) o = idx + t.w.length;
    const pos = TAGS[t.tag]||["",""];
    if (t.tag === "x") return `<span class="w punct" data-o="${idx}"><span class="t">${esc(t.w)}</span><span class="lb" aria-hidden="true">&nbsp;</span></span>`;
    if (mode === "tap") return `<button class="w" data-i="${i}" data-o="${idx}"><span class="t">${esc(t.w)}</span><span class="lb" aria-hidden="true">&nbsp;</span></button>`;
    const colored = "nvarp".includes(t.tag);
    return `<span class="w ${colored?t.tag:"plain"}" data-o="${idx}"><span class="t">${esc(t.w)}</span><span class="lb">${colored?pos[0]:"&nbsp;"}</span></span>`;
  }).join("");
}

/* ---------- visuals ---------- */
function graphSVG(g){
  const R = 6, W = 240, sc = W/(2*R), X = x => (x+R)*sc, Y = y => (R-y)*sc; let s = "";
  for (let i=-R;i<=R;i++){ s += `<path class="grid" d="M${X(i)} 0V${W}M0 ${Y(i)}H${W}"/>`; }
  s += `<path class="ax" d="M${X(0)} 0V${W}M0 ${Y(0)}H${W}"/>`;
  for (const i of [-4,-2,2,4]) s += `<text x="${X(i)}" y="${Y(0)+14}" text-anchor="middle">${i<0?"−"+(-i):i}</text><text x="${X(0)-6}" y="${Y(i)+4}" text-anchor="end">${i<0?"−"+(-i):i}</text>`;
  s += `<text x="${W-6}" y="${Y(0)-6}" text-anchor="end">x</text><text x="${X(0)+6}" y="12">y</text>`;
  const cols = ["var(--accent)","var(--noun)","var(--verb)"];
  (g.lines||[]).forEach(([m,b],k) => { s += `<path d="M${X(-R)} ${Y(m*-R+b)}L${X(R)} ${Y(m*R+b)}" style="stroke:${cols[k%3]};stroke-width:4;stroke-linecap:round"/>`; });
  if (g.quad){ const [a,b,c] = g.quad; let d = ""; for (let x=-R;x<=R+0.001;x+=0.1){ const y = a*x*x+b*x+c; d += (d?"L":"M")+X(x).toFixed(1)+" "+Y(Math.max(-R-2,Math.min(R+2,y))).toFixed(1); } s += `<path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round"/>`; }
  (g.pts||[]).forEach(([x,y]) => { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="6" style="fill:var(--navy);stroke:var(--card);stroke-width:2"/>`; });
  return `<svg class="graph" viewBox="0 0 ${W} ${W}" role="img" aria-label="Graph"><defs><clipPath id="gc"><rect width="${W}" height="${W}"/></clipPath></defs><g clip-path="url(#gc)">${s}</g></svg>`;
}
function punnettHTML([a,b]){
  const cell = (x,y) => { const p = [x,y].sort((m,n)=> (m===m.toUpperCase()?0:1)-(n===n.toUpperCase()?0:1)).join(""); return `<td class="${p===p.toLowerCase()?"rec":"dom"}">${p}</td>`; };
  return `<table class="pun" aria-label="Punnett square: parent one ${esc(a)}, parent two ${esc(b)}"><caption>Top: ${esc(a)} · Side: ${esc(b)}</caption>
    <tr><th></th><th>${a[0]}</th><th>${a[1]}</th></tr><tr><th>${b[0]}</th>${cell(a[0],b[0])}${cell(a[1],b[0])}</tr><tr><th>${b[1]}</th>${cell(a[0],b[1])}${cell(a[1],b[1])}</tr></table>`;
}

/* read several blocks one after another, each with its own highlighting */
function readSequence(els, btn){

    const u = new SpeechSynthesisUtterance(spoken(el.dataset.text||el.textContent)); u.rate = S.rate; if (voice) u.voice = voice;
    let list = [...el.querySelectorAll("[data-o]")]; const tx = el.dataset.text||el.textContent;
    if (changes(tx)) { list = []; el.classList.add("reading"); }
    u.onboundary = e => { if (e.name === "sentence") return; let hit = null; for (const s of list) { if (+s.dataset.o <= e.charIndex) hit = s; else break; } list.forEach(s=>s.classList.remove("cur","speaking")); if (hit) hit.classList.add(hit.classList.contains("w")?"speaking":"cur"); };

let lastAct = 0;

const SYNC_URL = "/api/progress", SYNC_TOKEN = "bayo-sync-v1"; let syncT = null, answered = 0;

/* 3. Word power */
function words(){ let k = 0;
  const draw = () => { const [ps, ms, say, sum] = LV.words[k];
    $("wBox").innerHTML = `<div class="v-word">${ps.map((p,i)=>`<button class="v-chunk c${i}" data-i="${i}">${E(p)}</button>`).join("")}</div>
      <div class="v-mean">${ms.map((m,i)=>m?`<span style="color:${["var(--blue)","var(--accent)","var(--good)"][i]}">${E(m)}</span>`:"").filter(Boolean).join(" + ")}</div><div class="v-cap" style="font-size:21px">${E(sum)}</div>`;
    document.querySelectorAll(".v-chunk").forEach(c => c.onclick = () => { const i = +c.dataset.i; tick(); sayRaw(`${ps[i]}. ${ms[i] ? "Means " + ms[i] + "." : ""}`); });
    document.querySelectorAll(".v-wcards button").forEach((b,i) => b.classList.toggle("on", i===k)); sayRaw(say); };
  frame(`<p class="v-prompt">Big words are just small parts. Tap each colored part.</p><div class="v-wcards">${LV.words.map((w,i)=>`<button data-i="${i}">${E(w[0].join(""))}</button>`).join("")}</div>
    <div id="wBox" style="display:flex;flex-direction:column;gap:12px"></div><div class="row v-center"><button class="btn" id="wAgain">🔁 Hear it again</button><button class="btn go" id="wNext">Next word →</button></div>`, "The beat");
  document.querySelectorAll(".v-wcards button").forEach(b => b.onclick = () => { k = +b.dataset.i; draw(); });
  $("wAgain").onclick = () => sayRaw(LV.words[k][2]); $("wNext").onclick = () => { k = (k+1) % LV.words.length; draw(); };
  draw(); }

/* 4. Beat */
let beatT = null, bctx = null;
function drum(kind){ try { const a = bctx = bctx || new (window.AudioContext||window.webkitAudioContext)(), t = a.currentTime, g = a.createGain(); g.connect(a.destination);
  if (kind==="k"){ const o=a.createOscillator(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); o.start(t); o.stop(t+.2); }
  else { const len = kind==="s"?.15:.04, b = a.createBuffer(1, a.sampleRate*len, a.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(); f.type = kind==="s"?"bandpass":"highpass"; f.frequency.value = kind==="s"?1800:7000; s.buffer=b; s.connect(f).connect(g);
    g.gain.setValueAtTime(kind==="s"?.35:.12,t); g.gain.exponentialRampToValueAtTime(.001,t+len); s.start(t); } } catch(e) {} }
function beatStart(){ beatStop(); let n = 0; beatT = setInterval(() => { const k = n++ % 8; if (k===0||k===3||k===5) drum("k"); if (k===2||k===6) drum("s"); drum("h");
  document.querySelectorAll(".v-beatviz i").forEach((e,i) => e.classList.toggle("hit", i===k)); }, 60000/88/2); }
function beatStop(){ clearInterval(beatT); beatT = null; document.querySelectorAll(".v-beatviz i").forEach(e => e.classList.remove("hit")); }
function beat(){
  frame(`<p class="v-prompt">Learn it like a song. Play the beat and follow along.</p><div class="v-beatviz" aria-hidden="true">${"<i></i>".repeat(8)}</div>
    <div class="v-lyrics" id="bLyr">${LV.beat.map(l=>`<p>${E(l)}</p>`).join("")}</div>
    <div class="row v-center"><button class="btn go v-big" id="bPlay">🎤 Play the beat</button><button class="btn" id="bVoice">🗣 Words only</button></div>
    <p class="small muted">Play it twice. The second time, say it with the voice.</p>`, "Play");
  const my = tok; let on = false;
  const sing = async withBeat => { on = true; if (withBeat) beatStart(); await sleep(withBeat ? 1400 : 0); const ps = [...document.querySelectorAll("#bLyr p")];
    for (let i=0;i<ps.length && on && my===tok;i++){ ps.forEach((p,j)=>p.classList.toggle("now", j===i)); const ok = await sayRaw(LV.beat[i]); if (!ok) break; }
    if (my !== tok) return; ps.forEach(p=>p.classList.remove("now")); beatStop(); on = false; $("bPlay").textContent = "🎤 Play the beat"; doneSt.add(3); };
  $("bPlay").onclick = () => { if (on) { on = false; hush(); beatStop(); $("bPlay").textContent = "🎤 Play the beat"; } else { $("bPlay").textContent = "⏹ Stop"; sing(true); } };
  $("bVoice").onclick = () => { if (!on) sing(false); };
}

/* 5. Play */
function play(items, replay){ items = items || LV.play.map(q => Object.assign({}, q, {_lv:LV}));
  P = {items, i:0, right:0, res:[], miss:[], replay:!!replay};
  if (!replay) qset = {qs: items.map((_,i)=>i), n:0, right:0};
  ask(); }
function ask(){ const q = P.items[P.i];
  frame(`<div class="v-dots">${P.items.map((_,j)=>`<i class="${P.res[j]===true?"ok":P.res[j]===false?"no":j===P.i?"now":""}"></i>`).join("")}</div>
    <div class="v-qtop"><button class="btn" id="qHear" aria-label="Hear it again">🔊</button><p class="v-prompt">${capHTML(q.cap)}</p></div>
    <div id="qBody" style="display:flex;flex-direction:column;gap:12px"></div><div id="qFb"></div>`, "");
  $("qHear").onclick = () => sayRaw(q.say);
  const fin = (ok, why, show) => answered(q, ok, why, show);
  ({tap:qTap, tf:qTf, sort:qSort, match:qMatch, seq:qSeq, pick:qPick, mc:qMc, build:qBuild, pickline:qPickLine, ydot:qYdot, balance:qBal, dna:qDna, pun:qPun, tltap:qTl})[q.t](q, $("qBody"), fin);
  sayRaw(q.say);
}
function answered(q, ok, why, show){
  if (P.res[P.i] !== undefined) return; P.res[P.i] = ok; if (ok) P.right++; else P.miss.push(q);
  if (P.replay) { ok ? SFX.ok() : SFX.no(); if (ok) { S.points += 1; save(); paintBoard(); } } else score(ok, {prompt: plain(q.cap)});
  const cheer = ok ? CHEERS_OK[Math.floor(Math.random()*CHEERS_OK.length)] : CHEERS_NO[Math.floor(Math.random()*CHEERS_NO.length)];
  const last = P.i + 1 >= P.items.length;
  $("qFb").innerHTML = `<div class="v-fb ${ok?"ok":"no"}">${ok?IC.yes:IC.nope}<div><div>${E(cheer)}${ok&&!P.replay?" +2":""}</div>${why?`<div style="font-weight:500">${E(why)}</div>`:""}</div></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="fbHear">🔊 Hear it</button><button class="btn go v-big" id="qNext">${last?"See my score":"Next"} →</button></div>`;
  if (show) show();
  const talk = cheer + " " + (why || ""); sayRaw(talk); $("fbHear").onclick = () => sayRaw(talk);
  $("qNext").onclick = () => { P.i++; if (P.i < P.items.length) ask(); else finish(); };
  $("qNext").focus({preventScroll:true}); $("qBody").style.pointerEvents = "none";
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; $("qFb").scrollIntoView({behavior: calm ? "auto" : "smooth", block:"nearest"});
}
function finish(){ lastMiss = P.miss.slice();
  if (!P.replay) { doneSt.add(4); qset.right = P.right; done(); return; }
  const n = P.items.length;
  frame(`<p class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">Replay round</p><h1 style="font-size:52px;line-height:1;text-align:center">${P.right} / ${n}</h1>
    <p class="v-cap">${P.right===n?"All fixed, Bayo. That's growth.":"Getting there. Run them back once more."}</p>
    <div class="row v-center">${P.miss.length?`<button class="btn go v-big" id="rAgain">🔁 Replay ${P.miss.length} more</button>`:""}<button class="btn" id="rAll">Play the full level</button><button class="btn" id="rMap">Season map</button></div>`, "");
  sayRaw(P.right===n ? "All fixed, Bayo. That's growth." : "Getting there. Let's run those back once more.");
  if ($("rAgain")) $("rAgain").onclick = () => play(mix(P.miss), true);
  $("rAll").onclick = () => openStage(4); $("rMap").onclick = home;
}

function qSort(q, body, fin){
  let sel = null; const where = {}; const items = mix(q.items.map((it,i)=>({t:it[0], ic:it[1], bin:it[2], say:it[3]||it[0], k:i})));
  const chip = it => `<button class="v-chip ${sel===it.k?"sel":""}" data-k="${it.k}">${icon(it.ic)}${E(it.t)}</button>`;
  const draw = () => { body.innerHTML = `<div class="v-chips" id="sPool">${items.filter(it=>where[it.k]==null).map(chip).join("")}</div>
    <div class="v-bins">${q.bins.map((b,j)=>`<button class="v-bin" data-b="${j}"><b>${E(b)}</b><span class="v-chips">${items.filter(it=>where[it.k]===j).map(chip).join("")}</span></button>`).join("")}</div>
    <div class="row"><button class="btn go" id="sCheck" ${Object.keys(where).length<items.length?"disabled":""}>Check</button></div>`;
    body.querySelectorAll("#sPool .v-chip").forEach(c => c.onclick = () => { sel = +c.dataset.k; sayLabel(items.find(x=>x.k===sel).say); draw(); });
    body.querySelectorAll(".v-bin").forEach(bn => bn.onclick = e => { const ic = e.target.closest(".v-chip");
      if (ic) { delete where[+ic.dataset.k]; draw(); return; }
      if (sel==null) { sayRaw("Tap one first, then tap a box."); return; } where[sel] = +bn.dataset.b; tick(); sayLabel(q.bins[+bn.dataset.b].replace(/[↗↘]/g,"")); sel = null; draw(); });
    $("sCheck").onclick = () => { const wrong = items.filter(it => where[it.k] !== it.bin);
      body.querySelectorAll(".v-bin .v-chip").forEach(c => { const it = items.find(x=>x.k===+c.dataset.k); c.classList.add(where[it.k]===it.bin?"ok":"no"); });
      fin(!wrong.length, wrong.length ? wrong.map(it=>`${it.say} goes in ${q.bins[it.bin].replace(/[↗↘]/g,"").trim()}.`).join(" ") : "All sorted right."); }; };
  draw();
}
function qMatch(q, body, fin){
  const left = q.pairs.map((p,i)=>({i,t:p[0],ic:p[1]})), right = mix(q.pairs.map((p,i)=>({i,t:p[2]})));
  let sel = null, made = {}, n = 0, wrongs = 0; const pc = {};
  const draw = () => { body.innerHTML = `<div class="v-match"><div class="col">${left.map(l=>`<button class="v-mi ${pc[l.i]!=null?"p"+pc[l.i]:""} ${sel===l.i?"sel":""}" data-l="${l.i}">${icon(l.ic)}${E(l.t)}</button>`).join("")}</div>
    <div class="col">${right.map(r=>`<button class="v-mi ${made[r.i]?"p"+pc[r.i]:""}" data-r="${r.i}">${E(r.t)}</button>`).join("")}</div></div>`;
    body.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { const i = +b.dataset.l; if (made[i]) return; sel = i; sayLabel(left[i].t); draw(); });
    body.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const i = +b.dataset.r; if (made[i]) return; const r = right.find(x=>x.i===i);
      if (sel==null) { sayLabel(r.t + ". Tap one on the left first."); return; }
      if (i === sel) { made[i] = true; pc[i] = n++ % 4; tick(); sayLabel(r.t); sel = null; draw();
        if (n === left.length) fin(wrongs === 0, wrongs ? `All matched, with ${wrongs} wrong tr${wrongs>1?"ies":"y"} along the way.` : "Every match on the first try."); }
      else { wrongs++; SFX.no(); b.classList.add("no"); sayRaw("Not that one. Try again."); setTimeout(draw, 700); } }); };
  draw();
}
function qSeq(q, body, fin){
  let order; do { order = mix(q.items.map((_,i)=>i)); } while (order.length > 1 && order.every((v,i)=>v===i));
  const pk = [];
  const draw = () => { body.innerHTML = `<div class="v-seq">${q.items.map((_,j)=>pk[j]!=null?`<div class="v-slot filled"><span class="n">${j+1}</span><button data-p="${j}">${icon(q.items[pk[j]][1])}${E(q.items[pk[j]][0])}</button></div>`:`<div class="v-slot"><span class="n">${j+1}</span><span class="muted small">tap one below</span></div>`).join("")}</div>
    <div class="v-chips">${order.filter(k=>!pk.includes(k)).map(k=>`<button class="v-chip" data-k="${k}">${icon(q.items[k][1])}${E(q.items[k][0])}</button>`).join("")}</div>
    <div class="row"><button class="btn go" id="qCheck" ${pk.length<q.items.length?"disabled":""}>Check</button></div>`;
    body.querySelectorAll(".v-chip").forEach(c => c.onclick = () => { pk.push(+c.dataset.k); tick(); sayLabel(q.items[+c.dataset.k][0]); draw(); });
    body.querySelectorAll(".v-slot button").forEach(b => b.onclick = () => { pk.splice(+b.dataset.p,1); draw(); });
    $("qCheck").onclick = () => { body.querySelectorAll(".v-slot").forEach((s,j)=>s.classList.add(pk[j]===j?"ok":"no")); const ok = pk.every((k,j)=>k===j);
      fin(ok, (ok ? "" : "The right order: ") + q.items.map(x=>spoken(x[0])).join(", then ") + "."); }; };
  draw();
}
function qPick(q, body, fin){ const opts = mix(q.opts);

function qPun(q, body, fin){ const [a,b] = q.p, vals = [null,null,null,null], marks = {}; let cur = 0;
  const want = [[a[0],b[0]],[a[1],b[0]],[a[0],b[1]],[a[1],b[1]]].map(xy => xy.sort((m,n)=>(m===m.toUpperCase()?0:1)-(n===n.toUpperCase()?0:1)).join(""));
  const draw = () => { body.innerHTML = `<div class="v-stage">${punHTML(a, b, 0, {ask:1, vals, marks:Object.assign({}, marks, {[cur]:(marks[cur]||"")+" sel"})})}</div>
