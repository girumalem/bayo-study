<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bayo's Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eaf0f6;--card:#f8fafc;--ink:#1c2430;--muted:#566273;--line:#c9d3df;--accent:#e2681f;--accent-ink:#fff;--navy:#1d3557;
  --good:#1d7a4c;--good-bg:#dcf1e5;--bad:#b4421d;--bad-bg:#fbe5da;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a22;--card:#1c2430;--ink:#eef2f7;--muted:#a6b1c0;--line:#323e4e;--accent:#f0823a;--accent-ink:#1a0d03;--navy:#9cc3ee;
  --good:#6fd39b;--good-bg:#143726;--bad:#f39a72;--bad-bg:#3d2116;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:16px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:clamp(26px,5vw,34px);font-weight:800;line-height:1.15}
h2{margin:0;font-size:20px;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-weight:700;min-height:44px;border-radius:12px;padding:0 16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=password]{font:inherit;font-size:24px;letter-spacing:.3em;width:9ch;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.err{color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--accent-ink)}
.day.on i{background:var(--good);border-color:var(--good)} .day.today{color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:2px solid var(--line);padding-top:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.chart span{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis{display:flex;gap:4px}.axis small{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
@media (max-width:440px){.subs{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
.stars{color:var(--accent);letter-spacing:.1em;white-space:nowrap}.stars .off{color:var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--line)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.miss{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.miss b{font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header class="row"><div><span class="lbl">Parent view</span><h1>Bayo's progress</h1></div><button class="btn" id="refresh" hidden>Refresh</button></header>

  <section class="card" id="setup" hidden>
    <h2>Create a parent PIN</h2>
    <p class="muted">Pick 4 to 12 digits. Anyone with this PIN can see Bayo's progress. You only do this once.</p>
    <form id="setupForm" class="row" style="justify-content:flex-start"><input type="password" inputmode="numeric" autocomplete="new-password" id="newPin" aria-label="New PIN"><input type="password" inputmode="numeric" autocomplete="new-password" id="newPin2" aria-label="Repeat PIN" placeholder="again"><button class="btn go">Save PIN</button></form>
    <p class="err" id="setupErr"></p>
  </section>

  <section class="card" id="login" hidden>
    <h2>Enter the parent PIN</h2>
    <form id="loginForm" class="row" style="justify-content:flex-start"><input type="password" inputmode="numeric" autocomplete="current-password" id="pin" aria-label="PIN"><button class="btn go">Open</button></form>
    <label class="chk"><input type="checkbox" id="remember"> Remember on this device</label>
    <p class="err" id="loginErr"></p>
  </section>

  <section class="card" id="empty" hidden><h2>No progress yet</h2><p class="muted">Once Bayo opens <b>bayo-grammar.netlify.app</b> and plays a few questions, his progress shows up here automatically.</p></section>

  <div id="dash" hidden style="display:flex;flex-direction:column;gap:16px"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let PIN = ""; try { PIN = localStorage.getItem("bayo-parent-pin") || ""; } catch(e) {}
const show = id => ["setup","login","empty","dash"].forEach(k => $(k).hidden = k !== id);

async function load(){
  let r;
  try { r = await fetch("/api/progress", {headers:{"x-parent-pin":PIN}, cache:"no-store"}); } catch(e) { $("loginErr").textContent = "Can't reach the server. Check your connection."; show("login"); return; }
  if (r.status === 428) { show("setup"); return; }
  if (r.status === 401) { if (PIN) $("loginErr").textContent = "That PIN didn't work."; PIN = ""; try { localStorage.removeItem("bayo-parent-pin"); } catch(e) {} show("login"); $("pin").focus(); return; }
  if (r.status === 429) { $("loginErr").textContent = "Too many tries. Wait a minute and try again."; show("login"); return; }
  let data; try { data = await r.json(); } catch(e) { $("loginErr").textContent = "Something went wrong loading progress. Try Refresh."; show("login"); return; }
  $("refresh").hidden = false;
  if (data.empty) { show("empty"); return; }
  render(data); show("dash");
}
$("setupForm").onsubmit = async e => { e.preventDefault(); const a = $("newPin").value.trim(), b = $("newPin2").value.trim();
  if (!/^\d{4,12}$/.test(a)) { $("setupErr").textContent = "Use 4 to 12 digits."; return; }
  if (a !== b) { $("setupErr").textContent = "The two PINs don't match."; return; }
  const r = await fetch("/api/progress", {method:"POST", headers:{"x-setup-pin":a}});
  if (!r.ok) { $("setupErr").textContent = (await r.json().catch(()=>({}))).error || "Couldn't save the PIN."; return; }
  PIN = a; load(); };
$("loginForm").onsubmit = e => { e.preventDefault(); PIN = $("pin").value.trim(); $("loginErr").textContent = "";
  if ($("remember").checked) { try { localStorage.setItem("bayo-parent-pin", PIN); } catch(e) {} } load(); };
$("refresh").onclick = load;

/* days are saved as "YYYY-M-D" in Bayo's local time */
const key = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const mins = s => Math.round((s||0)/60);
const pct = (ok,q) => q ? Math.round(ok/q*100)+"%" : "–";
const starsOf = b => b==null?0:b>=0.9?3:b>=0.7?2:b>=0.5?1:0;
const starHTML = n => `<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i=>`<span class="${i<n?"":"off"}">★</span>`).join("")}</span>`;
function ago(t){ if (!t) return "never"; const m = Math.round((Date.now()-t)/60000); if (m < 2) return "just now"; if (m < 60) return m+" min ago"; const h = Math.round(m/60); if (h < 24) return h+" hr ago"; const d = Math.round(h/24); return d+(d===1?" day ago":" days ago"); }

function render(D){
  const days = D.days || {}, subs = D.subjects || [], best = D.best || {}, now = new Date();
  const subName = Object.fromEntries(subs.map(s=>[s.id,s.name]));
  // this week, Monday to Sunday
  const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  let wq=0, wok=0, wsec=0, wdays=0; const week = [];
  for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); const r = days[key(d)]; if (r && r.q){ wq+=r.q; wok+=r.ok; wsec+=r.sec||0; wdays++; }
    week.push(`<div class="day ${r&&r.q?"on":""} ${key(d)===key(now)?"today":""}"><i>${r&&r.q?mins(r.sec)||"✓":""}</i>${"MTWTFSS"[i]}</div>`); }
  // last 14 days chart (minutes)
  const last = []; for (let i=13;i>=0;i--){ const d = new Date(now); d.setDate(now.getDate()-i); last.push([d, days[key(d)]]); }
  const maxM = Math.max(10, ...last.map(([,r]) => mins(r&&r.sec)));
  const chart = last.map(([d,r]) => { const m = mins(r&&r.sec); return `<div title="${d.toDateString()}: ${m} min, ${r?r.q:0} questions"><small>${m||""}</small><span style="height:${m/maxM*100}%"></span></div>`; }).join("");
  const axis = last.map(([d]) => `<small>${d.getDate()}</small>`).join("");
  // per subject accuracy this week
  const wsub = {}; for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); const r = days[key(d)]; if (r && r.s) for (const [k,v] of Object.entries(r.s)) { wsub[k] = wsub[k]||{q:0,ok:0}; wsub[k].q+=v.q; wsub[k].ok+=v.ok; } }
  const subCards = subs.map(s => {
    const won = s.levels.filter(([id]) => (best[id]||0) >= 0.5).length, champ = (best[s.boss]||0) >= 0.5, ws = wsub[s.id];
    const rows = s.levels.map(([id,name],i) => { const b = best[id]; return `<tr><td>${i+1}. ${esc(name)}</td><td>${starHTML(starsOf(b))}</td><td class="r">${b==null?'<span class="muted">not yet</span>':Math.round(b*100)+"%"}</td></tr>`; }).join("")
      + `<tr><td>🏆 Championship</td><td>${starHTML(starsOf(best[s.boss]))}</td><td class="r">${best[s.boss]==null?'<span class="muted">locked</span>':Math.round(best[s.boss]*100)+"%"}</td></tr>`;
    return `<section class="card"><div class="row"><h2>${esc(s.name)}</h2><span class="pill ${champ?"good":""}">${champ?"Champion":won+" of "+s.levels.length+" levels won"}</span></div>
      <p class="small muted">This week: ${ws?`${ws.q} questions, ${pct(ws.ok,ws.q)} right`:"no practice yet"}</p>
      <table><thead><tr><th>Level</th><th>Stars</th><th class="r">Best score</th></tr></thead><tbody>${rows}</tbody></table></section>`; }).join("");
  const misses = (D.miss||[]).slice(-15).reverse().map(m => `<div class="miss"><span class="lbl">${esc(subName[m.s]||m.s)} · ${esc(m.l)} · ${ago(m.t)}</span><b>${esc(m.p)}</b></div>`).join("");
  $("dash").innerHTML = `
  <section class="card"><div class="row"><span class="lbl">Last active: ${ago(D.sentAt||D.receivedAt)}</span><span class="pill">${D.points||0} points · ${D.streak||0} right in a row now</span></div>
    <h2>This week (Monday to Sunday)</h2><div class="days">${week.join("")}</div>
    <div class="stats"><div class="stat"><b>${wdays}</b><span class="small muted">days studied</span></div><div class="stat"><b>${mins(wsec)}</b><span class="small muted">minutes</span></div>
      <div class="stat"><b>${wq}</b><span class="small muted">questions</span></div><div class="stat"><b>${pct(wok,wq)}</b><span class="small muted">right</span></div></div>
    <p class="small muted">Minutes count active time in the app (tapping, listening, answering). Green circles show minutes that day.</p></section>
  <section class="card"><h2>Minutes per day, last 14 days</h2><div class="chart">${chart}</div><div class="axis">${axis}</div></section>
  <div class="subs">${subCards}</div>
  <section class="card"><h2>Needs practice</h2><p class="small muted">The last questions Bayo got wrong, newest first. Good ones to go over together.</p>${misses || '<p class="muted">Nothing missed yet.</p>'}</section>`;
}
load();
</script>
</body>
</html>
