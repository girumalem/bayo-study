<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0f6">
<title>Bayo's Study Court</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<style>
/* Layout: one thing at a time. Court-floor scoreboard on top, big tap targets, audio on everything.
   Readability: Lexend, large size, wide line + letter spacing, no italics, soft blue-gray paper (not pure white). */
:root{
  --bg:#eaf0f6; --card:#f8fafc; --ink:#1c2430; --muted:#566273; --line:#c9d3df;
  --accent:#e2681f; --accent-ink:#ffffff; --navy:#1d3557;
  --good:#1d7a4c; --good-bg:#dcf1e5; --bad:#b4421d; --bad-bg:#fbe5da;
  --noun:#2563c9; --verb:#c93a52; --adj:#1f8a52; --adv:#7b4bc0; --pron:#0d7f8a; --other:#7a8494;
  --font:"Lexend",Verdana,Tahoma,system-ui,sans-serif;
  --size:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a22; --card:#1c2430; --ink:#eef2f7; --muted:#a6b1c0; --line:#323e4e;
  --accent:#f0823a; --accent-ink:#1a0d03; --navy:#9cc3ee;
  --good:#6fd39b; --good-bg:#143726; --bad:#f39a72; --bad-bg:#3d2116;
  --noun:#7fb0ff; --verb:#ff8197; --adj:#6fd39b; --adv:#c3a1f7; --pron:#62d3dd; --other:#9aa4b2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a22; --card:#1c2430; --ink:#eef2f7; --muted:#a6b1c0; --line:#323e4e;
  --accent:#f0823a; --accent-ink:#1a0d03; --navy:#9cc3ee;
  --good:#6fd39b; --good-bg:#143726; --bad:#f39a72; --bad-bg:#3d2116;
  --noun:#7fb0ff; --verb:#ff8197; --adj:#6fd39b; --adv:#c3a1f7; --pron:#62d3dd; --other:#9aa4b2; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--size);line-height:1.7;letter-spacing:.02em;word-spacing:.08em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;line-height:1.2;letter-spacing:0}
.brand svg{flex:none}
.board{display:flex;gap:8px;align-items:stretch;background:var(--navy);color:var(--bg);border-radius:12px;padding:6px 12px;font-weight:700}
.board div{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px}
.board b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent)}
.board small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.iconbtn svg{width:24px;height:24px}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;line-height:1.25;letter-spacing:0}
h1{font-size:28px;font-weight:800}
h2{font-size:24px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:16px}

/* home */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.unit{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.unit:hover{border-color:var(--accent)}
.unit .num{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.unit .nm{font-size:20px;font-weight:800;line-height:1.3}
.stars{font-size:22px;letter-spacing:.15em;color:var(--line)} .stars .on{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* season map */
.rankcard{display:flex;gap:16px;align-items:center}
.rankbadge{flex:none;width:72px;height:72px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.rankbadge svg{width:56px;height:56px}
.rankname{font-size:26px;font-weight:800;line-height:1.2}
.xp{height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.xp i{display:block;height:100%;background:var(--accent);border-radius:8px}
.map{display:flex;flex-direction:column;align-items:stretch;padding:4px 0}
.stop{display:flex;align-items:center;gap:14px;width:min(100%,430px)}
.stop.r{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.stop.l{align-self:flex-start}
.link{height:46px;width:100%;display:block}
.link path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round}
.link.done path{stroke:var(--accent)}
.node{position:relative;flex:none;width:112px;height:112px;border-radius:50%;border:5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.node svg{width:84px;height:84px}
.node.open{border-color:var(--accent)}
.node.won{border-color:var(--good)}
.node.locked{background:var(--bg);border-style:dashed}
.node.locked .art{opacity:.25;filter:grayscale(1)}
.node .lockic{position:absolute;inset:0;display:grid;place-items:center}
.node .lockic svg{width:52px;height:52px}
.node.boss{width:132px;height:132px;border-width:6px}
.node.boss svg{width:100px;height:100px}
.lvnum{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);font-weight:800;font-size:14px;border-radius:10px;padding:2px 10px;white-space:nowrap}
.here{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.08em;border-radius:10px;padding:3px 10px;white-space:nowrap}
.here::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.here{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-5px)}}}
.stopinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.stopinfo .nm{font-size:20px;font-weight:800;line-height:1.25}
.stopinfo .st{font-size:15px;font-weight:700;color:var(--muted)}
.stop.r .stars{text-align:right}
.lvhead{display:flex;align-items:center;gap:14px}
.lvhead svg{flex:none;width:72px;height:72px}
/* celebration */
.celebrate{position:relative;overflow:hidden;align-items:center;text-align:center}
.celebrate .big svg{width:150px;height:150px}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;top:-12px;width:10px;height:16px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){.burst i{animation:fall 1.8s ease-in forwards}@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}}
.unlock{border:3px solid var(--accent);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.unlock svg{flex:none;width:72px;height:72px}
.unlock b{font-size:21px;display:block}
.pill{display:inline-block;background:var(--navy);color:var(--bg);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.subj{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;min-height:120px}
.subj:hover{border-color:var(--accent)}
.subj svg{flex:none;width:76px;height:76px}
.subj .nm{font-size:22px;font-weight:800;line-height:1.2;display:block}
.subj .st{font-size:15px;font-weight:700;color:var(--muted);display:block;margin:2px 0 6px}
.subj .xp{margin-top:0}
/* worked steps */
.steps{display:flex;flex-direction:column;gap:8px}
.step{font-size:26px;font-weight:700;line-height:1.35;padding:8px 14px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.step.new{border-color:var(--accent)}
.mathline{font-size:30px;font-weight:700;line-height:1.35;padding:10px 16px;border-radius:14px;background:var(--bg);border:2px solid var(--line);align-self:flex-start;max-width:100%}
.reading{outline:4px solid var(--accent);outline-offset:3px;border-radius:10px}
/* visuals */
.vis{display:flex;justify-content:center}
.vis svg.graph{width:100%;max-width:300px;height:auto}
.graph .grid{stroke:var(--line);stroke-width:1}
.graph .ax{stroke:var(--ink);stroke-width:2}
.graph text{font:700 11px Lexend,sans-serif;fill:var(--muted)}
.pun{border-collapse:separate;border-spacing:6px;font-size:26px;font-weight:800}
.pun th{width:72px;height:56px;color:var(--navy);font-size:22px}
.pun td{width:72px;height:64px;text-align:center;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.pun td.dom{color:var(--verb)} .pun td.rec{color:var(--noun)}
.pun caption{caption-side:bottom;font-size:15px;font-weight:700;color:var(--muted);padding-top:6px}
/* order questions */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slots li{counter-increment:s;display:flex;align-items:center;gap:12px;min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:0 12px;font-size:20px;font-weight:600}
.slots li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-size:16px;font-weight:800}
.slots li button{flex:1;text-align:left;border:0;background:transparent;font:inherit;min-height:52px;padding:0}
.slots li.filled{border-style:solid;border-color:var(--navy)}
.slots li.ok{border-color:var(--good);background:var(--good-bg)} .slots li.no{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-direction:column;gap:8px}
.pool button{text-align:left;min-height:56px;border:2px solid var(--accent);border-radius:14px;background:var(--card);padding:8px 14px;font-size:20px;font-weight:700}
.olist{margin:0;padding-left:28px;font-size:19px;font-weight:600;display:flex;flex-direction:column;gap:4px}

/* word chips (colour + label, never colour alone) */
.sent{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-end;font-size:24px;line-height:1.3}
.w{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:10px;border:2px solid transparent;background:transparent}
.w .t{font-weight:600}
.w .lb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.w.n{border-color:var(--noun)} .w.n .t,.w.n .lb{color:var(--noun)}
.w.v{border-color:var(--verb)} .w.v .t,.w.v .lb{color:var(--verb)}
.w.a{border-color:var(--adj)} .w.a .t,.w.a .lb{color:var(--adj)}
.w.r{border-color:var(--adv)} .w.r .t,.w.r .lb{color:var(--adv)}
.w.p{border-color:var(--pron)} .w.p .t,.w.p .lb{color:var(--pron)}
.w.plain .lb{visibility:hidden}
.w.punct{padding:4px 0;margin-left:-6px}
.w.punct .lb{visibility:hidden}
.w.speaking{background:var(--accent);border-color:var(--accent)} .w.speaking .t,.w.speaking .lb{color:var(--accent-ink)}
button.w{border-color:var(--line);background:var(--card);min-height:56px;min-width:48px;justify-content:center}
button.w .lb{visibility:hidden}
button.w:hover{border-color:var(--ink)}
button.w.pick-ok{background:var(--good-bg);border-color:var(--good)}
button.w.pick-bad{background:var(--bad-bg);border-color:var(--bad)}

/* readable text with spoken-word highlight */
.say span.cur{background:var(--accent);color:var(--accent-ink);border-radius:4px}
.tip{border-left:6px solid var(--accent);padding:6px 0 6px 14px;font-weight:500}
.ul{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px;text-decoration-color:var(--accent);font-weight:700}
.sentence{font-size:24px;line-height:1.6}

/* buttons */
.btn{min-height:56px;border-radius:14px;padding:0 22px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.listen{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 18px;border-radius:14px;border:2px solid var(--navy);background:transparent;font-weight:800;font-size:18px;color:var(--navy)}
.listen svg{width:26px;height:26px}
.listen.playing{background:var(--navy);color:var(--bg)}

/* choices */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:stretch;gap:0;border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.opt .pick{flex:1;text-align:left;border:0;background:transparent;padding:12px 16px;min-height:60px;font-size:21px;font-weight:600;display:flex;gap:14px;align-items:center}
.opt .letter{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:16px;font-weight:800}
.opt .hear{border:0;border-left:2px solid var(--line);background:transparent;width:64px;display:grid;place-items:center;color:var(--navy)}
.opt .hear svg{width:26px;height:26px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt .pick:disabled{cursor:default;color:inherit}

/* feedback */
.fb{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.fb.ok{border-color:var(--good);background:var(--good-bg)}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb .head{font-weight:800;font-size:22px}
.prog{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.cur{background:var(--navy)}

/* settings */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:10px 16px;font-weight:700;font-size:16px;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
select{font:inherit;font-size:16px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;max-width:100%}
label.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;min-height:48px}
label.chk input{width:24px;height:24px;accent-color:var(--accent)}
.notice{font-size:16px;border:2px dashed var(--line);border-radius:12px;padding:10px 14px}
@media (max-width:480px){:root{--size:19px}.sent{font-size:22px}.brand{font-size:19px}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="var(--accent)"/><path d="M2 18h32M18 2v32M7 6c5 4 5 20 0 24M29 6c-5 4-5 20 0 24" fill="none" stroke="var(--navy)" stroke-width="2"/></svg>
      <span>Bayo's Study Court</span>
    </div>
    <div class="row" style="gap:8px">
      <div class="board" aria-label="Scoreboard"><div><b id="pts">0</b><small>Points</small></div><div><b id="streak">0</b><small>Streak</small></div><div><b id="rankShort" style="font-size:16px;line-height:1.9">Rookie</b><small>Rank</small></div></div>
      <button class="iconbtn" id="setBtn" aria-label="Sound settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Sound</button>
    </div>
  </header>

  <section class="card" id="settings" hidden>
    <h2>Sound settings</h2>
    <div class="row"><span style="font-weight:700">Speed</span><div class="seg" id="speed"><button data-r="0.75">Slow</button><button data-r="0.9">Normal</button><button data-r="1.1">Fast</button></div></div>
    <label class="chk"><input type="checkbox" id="auto"> Read each question out loud automatically</label>
    <label class="chk"><input type="checkbox" id="sfx"> Game sounds (cheer when you get it right)</label>
    <div class="row"><span style="font-weight:700">Voice</span><select id="voice" aria-label="Voice"></select></div>
    <div class="row"><button class="listen" id="testVoice"></button></div>
    <p class="notice" id="noTTS" hidden>This browser can't read out loud. Try Chrome, Safari, or Edge.</p>
  </section>

  <main id="view"></main>
</div>
<script>
const SUBJ = [{"id": "gr", "name": "Grammar", "icon": "nv", "boss": "boss", "units": [{"id": "nv", "name": "Nouns & Verbs", "lesson": [{"h": "Nouns", "say": "A noun is a person, place, thing, or idea. Coach, gym, ball, and faith are all nouns.", "ex": "The/d coach/n grabbed/v the/d ball/n ./x", "tip": "Quick test: if you can say \"the\" or \"a\" in front of it, it's probably a noun."}, {"h": "Verbs", "say": "A verb is the action. It tells what someone does. Words like is, am, and are are verbs too.", "ex": "The/d quarterback/n throws/v a/d spiral/n ./x", "tip": "Ask yourself: what is happening? The answer is the verb."}, {"h": "On the mic", "say": "Here's a line of rap. Listen for the nouns and the verbs.", "ex": "I/p train/v at/o dawn/n ,/x my/p game/n is/v strong/a ./x", "tip": "Every complete sentence has at least one verb."}, {"h": "In the Bible", "say": "Bible stories are full of strong verbs. Listen to this one.", "ex": "David/n threw/v a/d stone/n ./x", "tip": "David and stone are nouns. Threw is the verb, the action."}], "q": [{"t": "tap", "s": "The/d point/n guard/n passes/v the/d ball/n ./x", "want": "v", "prompt": "Tap the verb.", "ex": "Passes is the action. It tells what the point guard does."}, {"t": "tap", "s": "Moses/n parted/v the/d sea/n ./x", "want": "n", "prompt": "Tap a noun.", "ex": "Moses is a person and sea is a place or thing. Both are nouns."}, {"t": "tap", "s": "Our/p team/n won/v the/d game/n ./x", "want": "v", "prompt": "Tap the verb.", "ex": "Won is the action. It tells what the team did."}, {"t": "tap", "s": "The/d crowd/n cheered/v loudly/r ./x", "want": "n", "prompt": "Tap the noun.", "ex": "Crowd is a thing (a group of people), so it's a noun."}, {"t": "tap", "s": "Jesus/n fed/v five/a thousand/a people/n ./x", "want": "v", "prompt": "Tap the verb.", "ex": "Fed is the action. It tells what Jesus did."}, {"t": "mc", "s": "", "prompt": "Which word is a noun?", "ch": ["stadium", "run", "quickly", "happy"], "a": 0, "ex": "A stadium is a place, so it's a noun.", "why": ["", "Run is an action, so it's a verb.", "Quickly tells how something is done, so it's an adverb.", "Happy describes someone, so it's an adjective."]}, {"t": "mc", "s": "", "prompt": "Which word is a verb?", "ch": ["sprinted", "helmet", "fast", "green"], "a": 0, "ex": "Sprinted is an action, so it's a verb.", "why": ["", "A helmet is a thing, so it's a noun.", "Fast describes something.", "Green is a color, a describing word."]}, {"t": "tap", "s": "I/p write/v my/p rhymes/n in/o a/d notebook/n ./x", "want": "v", "prompt": "Tap the verb.", "ex": "Write is the action. It tells what I do."}]}, {"id": "ar", "name": "Adjectives & Adverbs", "lesson": [{"h": "Adjectives", "say": "An adjective describes a noun. It answers: what kind, which one, or how many.", "ex": "The/d tall/a center/n blocked/v the/d shot/n ./x", "tip": "Tall tells what kind of center."}, {"h": "Adverbs", "say": "An adverb describes a verb. It tells how, when, or where something happens. Many adverbs end in -ly.", "ex": "She/p ran/v quickly/r down/o the/d field/n ./x", "tip": "Quickly tells how she ran. Look for the -ly ending."}, {"h": "Put them together", "say": "Adjectives describe things. Adverbs describe actions.", "ex": "The/d humble/a shepherd/n prayed/v quietly/r ./x", "tip": "Humble describes the shepherd. Quietly describes how he prayed."}], "q": [{"t": "tap", "s": "The/d loud/a crowd/n stood/v up/r ./x", "want": "a", "prompt": "Tap the adjective.", "ex": "Loud describes the crowd, so it's an adjective."}, {"t": "tap", "s": "The/d receiver/n caught/v the/d ball/n easily/r ./x", "want": "r", "prompt": "Tap the adverb.", "ex": "Easily tells how he caught the ball."}, {"t": "tap", "s": "He/p wore/v his/p new/a jersey/n ./x", "want": "a", "prompt": "Tap the adjective.", "ex": "New describes the jersey."}, {"t": "tap", "s": "The/d choir/n sang/v softly/r ./x", "want": "r", "prompt": "Tap the adverb.", "ex": "Softly tells how the choir sang."}, {"t": "tap", "s": "Goliath/n was/v a/d huge/a warrior/n ./x", "want": "a", "prompt": "Tap the adjective.", "ex": "Huge describes the warrior."}, {"t": "mc", "s": "", "prompt": "Which word is an adverb?", "ch": ["slowly", "slow", "slowness", "slows"], "a": 0, "ex": "Slowly tells how something is done, and it ends in -ly.", "why": ["", "Slow describes a thing, like a slow game, so it's an adjective.", "Slowness is a thing (an idea), so it's a noun.", "Slows is an action, so it's a verb."]}, {"t": "mc", "s": "She shoots [good].", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "well", "goodly", "more good"], "a": 1, "ex": "Shoots is an action, so describe it with an adverb: well.", "why": ["Good describes things (a good shot). Well describes actions (shoots well).", "", "Goodly isn't used this way.", "More good is incorrect."]}, {"t": "tap", "s": "I/p drop/v my/p verses/n smoothly/r ./x", "want": "r", "prompt": "Tap the adverb.", "ex": "Smoothly tells how I drop my verses."}]}, {"id": "pr", "name": "Pronouns", "lesson": [{"h": "Pronouns", "say": "A pronoun takes the place of a noun, so you don't repeat the name.", "ex": "Marcus/n scored/v ./x He/p celebrated/v ./x", "tip": "Common pronouns: I, you, he, she, it, we, they, me, him, her, us, them."}, {"h": "I or me?", "say": "Use I, he, she, we, and they for the person doing the action. Use me, him, her, us, and them for the person receiving the action.", "ex": "Coach/n called/v me/p and/c Andre/n ./x", "tip": "Trick: cover up the other person. Coach called me, not Coach called I."}], "q": [{"t": "tap", "s": "She/p passed/v the/d ball/n to/o him/p ./x", "want": "p", "prompt": "Tap a pronoun.", "ex": "She and him take the place of names."}, {"t": "mc", "s": "Andre and [me] went to practice.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "I", "myself", "mine"], "a": 1, "ex": "Cover up \"Andre and.\" You'd say \"I went to practice,\" not \"me went.\"", "why": ["You wouldn't say \"me went to practice.\"", "", "Myself can't be the person doing the action here.", "Mine shows ownership."]}, {"t": "mc", "s": "Coach gave the jerseys to Jaylen and [I].", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "me", "myself", "mine"], "a": 1, "ex": "Cover up \"Jaylen and.\" You'd say \"gave the jerseys to me.\"", "why": ["You wouldn't say \"gave the jerseys to I.\"", "", "Myself only works when I is also doing the action.", "Mine shows ownership."]}, {"t": "mc", "s": "The team lost [their] first game.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "its", "it's", "they're"], "a": 1, "ex": "The team is one group, so in formal writing use its.", "why": ["Their is for more than one, but the team is one group.", "", "It's means \"it is.\"", "They're means \"they are.\""]}, {"t": "mc", "s": "[Him] and his brother play football.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "He", "His", "Himself"], "a": 1, "ex": "Cover up \"and his brother.\" You'd say \"He plays football.\"", "why": ["You wouldn't say \"Him plays football.\"", "", "His shows ownership.", "Himself can't start a sentence like this."]}, {"t": "mc", "s": "God loves us, and we should love [each other].", "prompt": "Choose the best words for the underlined part.", "ch": ["Correct as is", "ourself", "them self", "each others"], "a": 0, "ex": "Each other is correct when two or more people do something to one another.", "why": ["", "Ourself isn't standard English.", "Them self isn't standard English.", "Each others isn't correct."]}, {"t": "tap", "s": "We/p prayed/v before/o the/d game/n ./x", "want": "p", "prompt": "Tap the pronoun.", "ex": "We takes the place of the names of the people praying."}, {"t": "mc", "s": "Between you and [I], that was a great dunk.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "me", "myself", "mine"], "a": 1, "ex": "After words like between, to, and for, use me.", "why": ["After between, use me.", "", "Myself doesn't fit here.", "Mine shows ownership."]}]}, {"id": "sv", "name": "Subject–Verb Agreement", "lesson": [{"h": "Match them up", "say": "The subject and the verb have to match. One player runs. Two players run.", "ex": "The/d player/n runs/v ./x The/d players/n run/v ./x", "tip": "The s usually goes on the noun or on the verb, not both."}, {"h": "Skip the middle", "say": "Sometimes words come between the subject and the verb. Skip them to find the real subject.", "ex": "The/d bag/n of/o footballs/n is/v heavy/a ./x", "tip": "The bag is heavy, not the footballs. Bag is the subject."}], "q": [{"t": "mc", "s": "The team [practice] every day.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "practices", "practicing", "have practiced"], "a": 1, "ex": "Team is one group, so it takes practices.", "why": ["One team needs the -s verb: practices.", "", "Practicing isn't a complete verb here.", "Have practiced is for more than one."]}, {"t": "mc", "s": "My brothers [plays] football.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "play", "playing", "has played"], "a": 1, "ex": "Brothers is more than one, so use play.", "why": ["Plays is for one person. Brothers is more than one.", "", "Playing isn't a complete verb here.", "Has is for one person."]}, {"t": "mc", "s": "Each of the players [have] a helmet.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "has", "are having", "have had"], "a": 1, "ex": "Each means one at a time, so use has.", "why": ["Each is singular, so it takes has.", "", "Are having is for more than one.", "Have had is for more than one."]}, {"t": "mc", "s": "The coach and the captain [is] ready.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "are", "was", "has been"], "a": 1, "ex": "Two people joined by and are plural, so use are.", "why": ["Coach and captain are two people, so use are.", "", "Was is for one person.", "Has been is for one person."]}, {"t": "mc", "s": "There [is] three games left.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "are", "was", "has been"], "a": 1, "ex": "The subject is games, which comes after the verb. Games is plural, so use are.", "why": ["Three games is more than one, so use are.", "", "Was is for one.", "Has been is for one."]}, {"t": "mc", "s": "One of the songs [are] on repeat.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "is", "were", "be"], "a": 1, "ex": "Skip \"of the songs.\" One is on repeat.", "why": ["The subject is one, not songs.", "", "Were is for more than one.", "Be doesn't fit here."]}, {"t": "mc", "s": "Jesus and his disciples [were] in the boat.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "was", "is", "has been"], "a": 0, "ex": "Jesus and his disciples are more than one person, so were is right.", "why": ["", "Was is for one person.", "Is is for one, and it's the wrong time (present).", "Has been is for one person."]}, {"t": "mc", "s": "Neither the players nor the coach [were] late.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "was", "are", "have been"], "a": 1, "ex": "With neither and nor, match the verb to the closer word, coach, which is one person. So use was.", "why": ["The verb matches coach, the closer word, which is one person.", "", "Are is for more than one and is the wrong time.", "Have been is for more than one."]}]}, {"id": "cs", "name": "Complete Sentences", "lesson": [{"h": "Complete sentence", "say": "A complete sentence has a subject, a verb, and a complete thought.", "ex": "The/d ball/n went/v in/r ./x", "tip": "Read it out loud. If it makes sense alone, it's complete."}, {"h": "Fragment", "say": "A fragment is only a piece of a sentence. It leaves you hanging.", "ex": "Because/c the/d game/n ran/v late/r ./x", "tip": "Because the game ran late... then what? It isn't finished."}, {"h": "Run-on", "say": "A run-on smashes two sentences together. Fix it with a period, with a comma plus and, but, or so, or with a semicolon.", "ex": "We/p won/v ,/x so/c we/p celebrated/v ./x", "tip": "Comma plus so joins the two sentences correctly."}], "q": [{"t": "mc", "s": "", "prompt": "Which is a complete sentence?", "ch": ["The ball went in.", "Because the ball went in.", "Running down the court.", "After the final buzzer."], "a": 0, "ex": "The ball went in has a subject (ball), a verb (went), and a complete thought.", "why": ["", "Because leaves you hanging. Because the ball went in... what happened?", "There's no subject. Who was running?", "After the final buzzer... what happened?"]}, {"t": "mc", "s": "", "prompt": "Which is a fragment?", "ch": ["When the whistle blew.", "The whistle blew.", "We ran.", "God is good."], "a": 0, "ex": "When the whistle blew... what happened? It isn't a complete thought.", "why": ["", "That's complete.", "That's complete. It's short, but it has a subject and a verb.", "That's complete."]}, {"t": "mc", "s": "We won the [game we] celebrated all night.", "prompt": "Choose the best fix for the underlined part.", "ch": ["Correct as is", "game, and we", "game, we", "game and, we"], "a": 1, "ex": "Two sentences need a comma plus and to join them.", "why": ["That's a run-on. Two sentences are smashed together.", "", "A comma alone isn't enough to join two sentences.", "The comma goes before and, not after it."]}, {"t": "mc", "s": "[Dribbling down the court.] Marcus scored.", "prompt": "Choose the best way to write this.", "ch": ["Correct as is", "Dribbling down the court, Marcus scored.", "Dribbling down the court; Marcus scored.", "Dribbling, down the court Marcus scored."], "a": 1, "ex": "Dribbling down the court is a fragment. Join it to the sentence with a comma.", "why": ["\"Dribbling down the court.\" is a fragment.", "", "A semicolon can't follow a fragment.", "The comma is in the wrong place."]}, {"t": "mc", "s": "I love rap [music, it] helps me focus.", "prompt": "Choose the best fix for the underlined part.", "ch": ["Correct as is", "music because it", "music it", "music, and, it"], "a": 1, "ex": "Because joins the two ideas and shows the reason.", "why": ["A comma alone can't join two sentences.", "", "That's a run-on.", "There's an extra comma after and."]}, {"t": "mc", "s": "", "prompt": "Which is a run-on?", "ch": ["The crowd roared the team ran out.", "The crowd roared, and the team ran out.", "The crowd roared. The team ran out.", "The crowd roared as the team ran out."], "a": 0, "ex": "The crowd roared and the team ran out are two sentences with nothing joining them.", "why": ["", "That's joined correctly with a comma plus and.", "Those are two correct sentences.", "As joins them correctly."]}, {"t": "mc", "s": "David trusted [God. And] faced Goliath.", "prompt": "Choose the best fix for the underlined part.", "ch": ["Correct as is", "God and", "God, and,", "God; and"], "a": 1, "ex": "And faced Goliath is a fragment. Join it: David trusted God and faced Goliath.", "why": ["\"And faced Goliath.\" is a fragment.", "", "There are too many commas.", "A semicolon needs a complete sentence on both sides."]}, {"t": "mc", "s": "", "prompt": "Which fixes the run-on \"Practice was hard I kept going\"?", "ch": ["Practice was hard, but I kept going.", "Practice was hard I, kept going.", "Practice was hard, I kept going.", "Practice was hard but, I kept going."], "a": 0, "ex": "Comma plus but joins the two sentences and shows the contrast.", "why": ["", "The comma is in the wrong place.", "A comma alone can't join two sentences.", "The comma goes before but."]}]}, {"id": "cm", "name": "Commas", "lesson": [{"h": "Lists", "say": "Use commas to separate three or more things in a list.", "ex": "We/p need/v cones/n ,/x balls/n ,/x and/c water/n ./x", "tip": "Listen: a comma is a short pause when you read out loud."}, {"h": "Intro words", "say": "Put a comma after a word or phrase that starts the sentence.", "ex": "After/o the/d game/n ,/x we/p ate/v ./x", "tip": "After the game (pause), we ate."}, {"h": "Joining sentences", "say": "Use a comma before and, but, or so when they join two sentences.", "ex": "I/p was/v tired/a ,/x but/c I/p finished/v ./x", "tip": "Comma plus but connects two complete sentences."}], "q": [{"t": "mc", "s": "We bought [cleats socks and] a helmet.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "cleats, socks, and", "cleats, socks and,", "cleats socks, and"], "a": 1, "ex": "Use commas between items in a list: cleats, socks, and a helmet.", "why": ["A list needs commas between items.", "", "The comma goes before and, not after.", "There needs to be a comma after cleats too."]}, {"t": "mc", "s": "After [practice we] went to church.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "practice, we", "practice we,", "practice; we"], "a": 1, "ex": "After practice starts the sentence, so put a comma after it.", "why": ["The opening phrase needs a comma after it.", "", "The comma goes after practice, not after we.", "A semicolon doesn't fit here."]}, {"t": "mc", "s": "The game was [close but] we won.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "close, but", "close but,", "close; but"], "a": 1, "ex": "When but joins two sentences, put a comma before it.", "why": ["A comma is needed before but.", "", "The comma goes before but.", "Don't use a semicolon with but."]}, {"t": "mc", "s": "[Yes,] I finished my homework.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "Yes", "Yes;", "Yes:"], "a": 0, "ex": "Put a comma after yes or no at the start of a sentence.", "why": ["", "Yes needs a comma after it.", "A semicolon doesn't fit here.", "A colon doesn't fit here."]}, {"t": "mc", "s": "My favorite [rapper, writes] songs about faith.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "rapper writes", "rapper; writes", "rapper: writes"], "a": 1, "ex": "Don't put a comma between the subject and its verb.", "why": ["The comma splits the subject (rapper) from the verb (writes).", "", "A semicolon can't go here.", "A colon can't go here."]}, {"t": "mc", "s": "Coach [said, that] we did great.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "said that", "said; that", "said: that"], "a": 1, "ex": "No comma is needed before that here.", "why": ["The comma isn't needed.", "", "A semicolon can't go here.", "A colon can't go here."]}, {"t": "mc", "s": "[Bayo can] you read this verse?", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "Bayo, can", "Bayo; can", "Bayo: can"], "a": 1, "ex": "When you speak to someone by name, put a comma after the name.", "why": ["Without a comma, it sounds like Bayo is the subject of can.", "", "A semicolon can't go here.", "A colon can't go here."]}, {"t": "mc", "s": "On [Sunday we] sang in church.", "prompt": "Choose the best version of the underlined part.", "ch": ["Correct as is", "Sunday, we", "Sunday; we", "Sunday: we"], "a": 1, "ex": "On Sunday starts the sentence, so put a comma after it.", "why": ["The opening phrase needs a comma.", "", "A semicolon doesn't fit here.", "A colon doesn't fit here."]}]}, {"id": "sa", "name": "Sound-Alike Words", "lesson": [{"h": "Same sound, different word", "say": "Some words sound exactly the same but mean different things. Your ears can't tell them apart, so use the picture tricks.", "ex": "", "tip": "Listening won't help here. Look at the letters."}, {"h": "there, their, they're", "say": "There is a place. Their means it belongs to them. They're means they are.", "ex": "They're/p at/o their/p gym/n over/o there/r ./x", "tip": "There has HERE inside it, a place. They're has an apostrophe for the missing A in they ARE."}, {"h": "your and you're", "say": "Your means it belongs to you. You're means you are.", "ex": "You're/p ready/a for/o your/p game/n ./x", "tip": "If you can say \"you are,\" use you're."}, {"h": "its and it's, to and too and two", "say": "It's means it is. Its means belonging to it. Two is the number 2. Too means also or very. To is everything else.", "ex": "It's/p time/n to/w pray/v too/r ./x", "tip": "Too has an extra O, so it means extra: also or very."}], "q": [{"t": "mc", "s": "[Their] going to the game.", "prompt": "Choose the right word.", "ch": ["Correct as is", "They're", "There", "Thier"], "a": 1, "ex": "They're means they are: \"They are going to the game.\"", "why": ["Their means belonging to them.", "", "There is a place.", "Thier is misspelled."]}, {"t": "mc", "s": "Put the ball over [their].", "prompt": "Choose the right word.", "ch": ["Correct as is", "there", "they're", "thier"], "a": 1, "ex": "There is a place, and it has HERE inside it.", "why": ["Their means belonging to them, not a place.", "", "They're means they are.", "Thier is misspelled."]}, {"t": "mc", "s": "The fans waved [there] towels.", "prompt": "Choose the right word.", "ch": ["Correct as is", "their", "they're", "there's"], "a": 1, "ex": "The towels belong to the fans, so use their.", "why": ["There is a place.", "", "They're means they are.", "There's means there is."]}, {"t": "mc", "s": "[Your] the best shooter on the team.", "prompt": "Choose the right word.", "ch": ["Correct as is", "You're", "Yore", "Youre"], "a": 1, "ex": "You're means you are: \"You are the best shooter.\"", "why": ["Your means belonging to you.", "", "Yore means long ago.", "Youre is missing the apostrophe."]}, {"t": "mc", "s": "Is this [you're] Bible?", "prompt": "Choose the right word.", "ch": ["Correct as is", "your", "yore", "you are"], "a": 1, "ex": "The Bible belongs to you, so use your.", "why": ["You're means you are: \"Is this you are Bible?\" doesn't make sense.", "", "Yore means long ago.", "\"You are Bible\" doesn't make sense."]}, {"t": "mc", "s": "The team won [it's] last game.", "prompt": "Choose the right word.", "ch": ["Correct as is", "its", "its'", "it is"], "a": 1, "ex": "The game belongs to the team, so use its, with no apostrophe.", "why": ["It's means it is.", "", "Its' isn't a word.", "\"Won it is last game\" doesn't make sense."]}, {"t": "mc", "s": "I want to play [to].", "prompt": "Choose the right word.", "ch": ["Correct as is", "too", "two", "toe"], "a": 1, "ex": "Too means also. It has an extra O, for extra.", "why": ["To is for direction, as in go to the gym.", "", "Two is the number 2.", "Toe is on your foot."]}, {"t": "mc", "s": "We scored [too] touchdowns.", "prompt": "Choose the right word.", "ch": ["Correct as is", "two", "to", "tow"], "a": 1, "ex": "Two is the number 2.", "why": ["Too means also or very.", "", "To is for direction.", "Tow means to pull."]}]}, {"id": "vt", "name": "Verb Tenses", "lesson": [{"h": "Past, present, future", "say": "Verbs tell time. Yesterday I played. Today I play. Tomorrow I will play.", "ex": "Yesterday/r I/p played/v ./x Tomorrow/r I/p will/v play/v ./x", "tip": "Time words like yesterday and tomorrow are clues."}, {"h": "Irregular verbs", "say": "Some verbs change completely in the past. Run becomes ran. Throw becomes threw. Write becomes wrote.", "ex": "He/p threw/v the/d ball/n ./x", "tip": "Never say throwed. Say threw."}, {"h": "Stay in one time", "say": "Keep your verbs in the same time unless the time really changes.", "ex": "David/n picked/v a/d stone/n and/c threw/v it/p ./x", "tip": "Picked and threw are both past."}], "q": [{"t": "mc", "s": "Yesterday, we [win] the game.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "won", "will win", "winning"], "a": 1, "ex": "Yesterday means the past, so use won.", "why": ["Win is present, but yesterday is past.", "", "Will win is future.", "Winning isn't a complete verb here."]}, {"t": "mc", "s": "Tomorrow, the team [played] at home.", "prompt": "Choose the best words for the underlined part.", "ch": ["Correct as is", "will play", "plays", "playing"], "a": 1, "ex": "Tomorrow means the future, so use will play.", "why": ["Played is past, but tomorrow is the future.", "", "Plays is present.", "Playing isn't a complete verb here."]}, {"t": "mc", "s": "He [throwed] a long pass.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "threw", "thrown", "throwing"], "a": 1, "ex": "Throw is irregular. The past is threw.", "why": ["Throwed isn't a word.", "", "Thrown needs has or had before it.", "Throwing isn't a complete verb here."]}, {"t": "mc", "s": "David picked up a stone and [throws] it.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "threw", "will throw", "throwing"], "a": 1, "ex": "Picked is past, so threw keeps the same time.", "why": ["Throws is present, but picked is past.", "", "Will throw is future.", "Throwing isn't a complete verb here."]}, {"t": "mc", "s": "I have [wrote] three new songs.", "prompt": "Choose the best word for the underlined part.", "ch": ["Correct as is", "written", "writed", "wrotten"], "a": 1, "ex": "After have, use written.", "why": ["Wrote doesn't go after have.", "", "Writed isn't a word.", "Wrotten isn't a word."]}, {"t": "tap", "s": "Last/a night/n ,/x we/p prayed/v together/r ./x", "want": "v", "prompt": "Tap the past-tense verb.", "ex": "Prayed is the action, and the -ed ending shows it happened in the past."}, {"t": "mc", "s": "", "prompt": "Which sentence is in the future?", "ch": ["I will practice after school.", "I practiced after school.", "I practice after school.", "I am practicing now."], "a": 0, "ex": "Will practice tells about something that will happen later.", "why": ["", "Practiced is past.", "Practice is present.", "Am practicing is happening now."]}, {"t": "mc", "s": "She [has went] to every game.", "prompt": "Choose the best words for the underlined part.", "ch": ["Correct as is", "has gone", "has goes", "have went"], "a": 1, "ex": "After has, use gone.", "why": ["Went doesn't go after has.", "", "Goes doesn't go after has.", "Have went is wrong twice."]}]}]}, {"id": "al", "name": "Algebra 1", "icon": "al6", "boss": "al-boss", "units": [{"id": "al1", "name": "Solving Equations", "lesson": [{"h": "Keep it balanced", "say": "Bayo, an equation is like a tied game. Whatever you do to one side, you have to do to the other side, so it stays tied.", "tip": "Undo adding with subtracting. Undo multiplying with dividing.", "steps": ["x + 7 = 15", "x + 7 − 7 = 15 − 7", "x = 8"]}, {"h": "Two-step equations", "say": "Undo things in reverse order. First undo the adding or subtracting. Then undo the multiplying or dividing.", "tip": "Check it: 3 times 5 is 15, plus 4 is 19. It works.", "steps": ["3x + 4 = 19", "3x = 15", "x = 5"]}, {"h": "Equations in the game", "say": "A player scores 2 points per basket, plus 6 points from free throws. He ends with 22 points. How many baskets?", "tip": "He made 8 baskets. Always plug your answer back in to check.", "steps": ["2b + 6 = 22", "2b = 16", "b = 8"]}], "q": [{"t": "mc", "s": "x + 9 = 20", "prompt": "Solve for x.", "ch": ["x = 11", "x = 29", "x = 20", "x = 9"], "a": 0, "ex": "Subtract 9 from both sides. 20 minus 9 is 11.", "why": ["", "You added 9. To undo plus 9, subtract 9.", "20 is the total, not x.", "9 is the number added to x, not x itself."]}, {"t": "mc", "s": "n − 6 = 14", "prompt": "Solve for n.", "ch": ["n = 20", "n = 8", "n = 14", "n = −20"], "a": 0, "ex": "Add 6 to both sides. 14 plus 6 is 20.", "why": ["", "You subtracted. To undo minus 6, add 6.", "14 is what's left after taking away 6. n is bigger.", "Check the sign. 20 minus 6 is 14, so n is positive 20."]}, {"t": "mc", "s": "4x = 28", "prompt": "Solve for x.", "ch": ["x = 7", "x = 24", "x = 32", "x = 112"], "a": 0, "ex": "4x means 4 times x. Divide both sides by 4. 28 divided by 4 is 7.", "why": ["", "That subtracts 4. 4x means 4 times x, so divide.", "That adds 4. Divide by 4 instead.", "That multiplies. Undo times 4 by dividing by 4."]}, {"t": "mc", "s": "3x + 4 = 19", "prompt": "Solve for x.", "ch": ["x = 5", "x = 15", "x = 6", "x = 3"], "a": 0, "ex": "Subtract 4: 3x = 15. Divide by 3: x = 5.", "why": ["", "15 is 3x. Divide by 3 to finish.", "Check: 3 times 6 plus 4 is 22, not 19.", "Check: 3 times 3 plus 4 is 13, not 19."]}, {"t": "order", "prompt": "Put the steps to solve this in order, starting with the problem.", "items": ["2x − 3 = 11", "2x = 14", "x = 7"], "ex": "Add 3 to both sides first, then divide by 2."}, {"t": "mc", "s": "", "prompt": "Bayo scores 3 points per three-pointer, plus 5 points from free throws. He has 26 points. Which equation fits?", "ch": ["3t + 5 = 26", "5t + 3 = 26", "3 + 5 = 26t", "3t = 26 + 5"], "a": 0, "ex": "3 points times t three-pointers, plus 5 free-throw points, equals 26.", "why": ["", "That makes each three-pointer worth 5.", "t goes with the 3, the points per shot.", "The free throws add to his points, so + 5 goes with 3t."]}, {"t": "mc", "s": "3t + 5 = 26", "prompt": "Solve for t.", "ch": ["t = 7", "t = 21", "t = 9", "t = 6"], "a": 0, "ex": "Subtract 5: 3t = 21. Divide by 3: t = 7. Bayo hit 7 threes.", "why": ["", "21 is 3t. Divide by 3 to finish.", "Check: 3 times 9 plus 5 is 32, not 26.", "Check: 3 times 6 plus 5 is 23, not 26."]}, {"t": "mc", "s": "x/5 = 6", "prompt": "Solve for x.", "ch": ["x = 30", "x = 1.2", "x = 11", "x = 6"], "a": 0, "ex": "x is divided by 5. Undo it by multiplying both sides by 5. 6 times 5 is 30.", "why": ["", "That divides again. Undo dividing by multiplying.", "That adds 5. Multiply by 5 instead.", "6 is x divided by 5, not x."]}]}, {"id": "al2", "name": "Multi-Step & Inequalities", "lesson": [{"h": "Distribute first", "say": "When a number sits outside parentheses, multiply it by everything inside. Like a coach giving the same play to every player on the court.", "tip": "", "steps": ["2(x + 3) = 16", "2x + 6 = 16", "2x = 10", "x = 5"]}, {"h": "Letters on both sides", "say": "Get all the x's on one team. Move them to the same side, then solve like normal.", "tip": "Subtract 3x from both sides to move the x's together.", "steps": ["5x + 2 = 3x + 10", "2x + 2 = 10", "2x = 8", "x = 4"]}, {"h": "Inequalities", "say": "An inequality says greater than or less than, instead of equals. Solve it just like an equation, with one special rule. If you multiply or divide by a negative number, flip the sign.", "tip": "The open side of the sign always faces the bigger number.", "steps": ["−2x > 8", "x < −4"]}], "q": [{"t": "mc", "s": "3(x − 2) = 12", "prompt": "Solve for x.", "ch": ["x = 6", "x = 2", "x = 4", "x = 5"], "a": 0, "ex": "Distribute: 3x − 6 = 12. Add 6: 3x = 18. Divide by 3: x = 6.", "why": ["", "Check: 3 times (2 minus 2) is 0, not 12.", "Check: 3 times (4 minus 2) is 6, not 12.", "Check: 3 times (5 minus 2) is 9, not 12."]}, {"t": "mc", "s": "5x + 2 = 3x + 10", "prompt": "Solve for x.", "ch": ["x = 4", "x = 1", "x = 6", "x = 8"], "a": 0, "ex": "Subtract 3x from both sides: 2x + 2 = 10. Then 2x = 8, so x = 4.", "why": ["", "Check: 5 plus 2 is 7, but 3 plus 10 is 13.", "Check: 30 plus 2 is 32, but 18 plus 10 is 28.", "Check: 40 plus 2 is 42, but 24 plus 10 is 34."]}, {"t": "mc", "s": "4x + 3 + 2x − 1", "prompt": "Simplify.", "ch": ["6x + 2", "8x", "6x + 4", "2x + 2"], "a": 0, "ex": "Put the x's together: 4x plus 2x is 6x. Put the numbers together: 3 minus 1 is 2.", "why": ["", "x terms and plain numbers can't be added together.", "3 minus 1 is 2, not 4.", "4x plus 2x is 6x, not 2x."]}, {"t": "mc", "s": "x + 5 > 12", "prompt": "Solve the inequality.", "ch": ["x > 7", "x < 7", "x > 17", "x = 7"], "a": 0, "ex": "Subtract 5 from both sides. The sign stays the same.", "why": ["", "You only flip the sign when you multiply or divide by a negative.", "Subtract 5, don't add it.", "It's an inequality, so the answer is a range of numbers, not one number."]}, {"t": "mc", "s": "−3x ≤ 15", "prompt": "Solve the inequality.", "ch": ["x ≥ −5", "x ≤ −5", "x ≥ 5", "x ≤ 5"], "a": 0, "ex": "Divide both sides by −3. Dividing by a negative flips the sign, so x ≥ −5.", "why": ["", "You divided by a negative number, so the sign has to flip.", "15 divided by −3 is −5, not 5.", "Two fixes: flip the sign, and 15 divided by −3 is −5."]}, {"t": "mc", "s": "x < 3", "prompt": "Which number makes this true?", "ch": ["−2", "3", "5", "10"], "a": 0, "ex": "Negative 2 is less than 3.", "why": ["", "3 is equal to 3, not less than it.", "5 is bigger than 3.", "10 is bigger than 3."]}, {"t": "order", "prompt": "Put the steps to solve this in order, starting with the problem.", "items": ["2(x + 4) = 18", "2x + 8 = 18", "2x = 10", "x = 5"], "ex": "Distribute the 2, subtract 8, then divide by 2."}, {"t": "mc", "s": "", "prompt": "Bayo wants at least 20 points this game. He already has 8. Each basket is 2 points. Which shows how many baskets, b, he needs?", "ch": ["8 + 2b ≥ 20", "8 + 2b ≤ 20", "2 + 8b ≥ 20", "8b ≥ 20"], "a": 0, "ex": "At least means 20 or more, so use greater than or equal to. Start at 8 and add 2 per basket.", "why": ["", "At least means 20 or more, so the sign is greater than or equal to.", "Each basket is worth 2, so the 2 goes with b.", "He already has 8 points. Add 2 points per basket."]}]}, {"id": "al3", "name": "Slope & Lines", "lesson": [{"h": "Slope is steepness", "say": "Slope tells how steep a line is. It's rise over run: how far up, divided by how far across.", "tip": "Going up from left to right is a positive slope. Going down is negative.", "vis": {"graph": {"lines": [[2, 1]], "pts": []}}}, {"h": "Slope from two points", "say": "Subtract the y's to get the rise. Subtract the x's to get the run. Then divide rise by run.", "tip": "", "steps": ["Points: (1, 3) and (3, 7)", "rise = 7 − 3 = 4", "run = 3 − 1 = 2", "slope = 4 ÷ 2 = 2"]}, {"h": "y = mx + b", "say": "In y equals m x plus b, m is the slope and b is where the line crosses the y axis. b is where you start. m is how much you add each step.", "tip": "Bayo, think of b as the points you start with and m as points per game.", "vis": {"graph": {"lines": [[3, -2]], "pts": [[0, -2]]}}}], "q": [{"t": "mc", "s": "y = 4x + 1", "prompt": "What is the slope of this line?", "ch": ["4", "1", "5", "x"], "a": 0, "ex": "The slope is the number in front of x.", "why": ["", "1 is b, where the line crosses the y axis.", "Don't add them. The slope is just the number with x.", "x is the variable. The slope is the number in front of it."]}, {"t": "mc", "s": "y = −2x + 6", "prompt": "Where does this line cross the y axis?", "ch": ["6", "−2", "2", "−6"], "a": 0, "ex": "b is the y-intercept, the number by itself. Here it's 6.", "why": ["", "−2 is the slope, the number with x.", "Look at the number by itself, not the one with x.", "The number by itself is positive 6."]}, {"t": "mc", "s": "(2, 1) and (4, 9)", "prompt": "Find the slope through these two points.", "ch": ["4", "1/4", "8", "2"], "a": 0, "ex": "Rise: 9 minus 1 is 8. Run: 4 minus 2 is 2. 8 divided by 2 is 4.", "why": ["", "That's run over rise. Slope is rise over run.", "8 is the rise. Divide it by the run, 2.", "2 is the run. Divide the rise by it."]}, {"t": "mc", "s": "", "prompt": "What is the slope of the line on the graph?", "ch": ["−1", "1", "3", "−3"], "a": 0, "ex": "It goes down 1 for every 1 across. That's a slope of −1.", "why": ["", "The line goes down from left to right, so the slope is negative.", "3 is where it crosses the y axis, not the slope.", "It drops 1 for each step across, not 3."], "vis": {"graph": {"lines": [[-1, 3]], "pts": []}}}, {"t": "mc", "s": "", "prompt": "Which line is the steepest?", "ch": ["y = 5x + 1", "y = 2x + 7", "y = x − 3", "y = 0.5x + 9"], "a": 0, "ex": "The biggest slope is the steepest. 5 is the biggest. The b number doesn't change steepness.", "why": ["", "Slope 2 is less steep than 5. The 7 doesn't matter for steepness.", "Slope 1 is less steep than 5.", "Slope 0.5 is the flattest one here. The 9 doesn't matter for steepness."]}, {"t": "mc", "s": "", "prompt": "A rapper has 200 followers and gains 50 every week. Which shows followers y after x weeks?", "ch": ["y = 50x + 200", "y = 200x + 50", "y = 250x", "y = 50x − 200"], "a": 0, "ex": "Start at 200, that's b. Add 50 per week, that's the slope.", "why": ["", "That gains 200 a week. The 50 per week goes with x.", "Don't add them together. 200 is the start, 50 is per week.", "He's gaining, so the start is plus 200."]}, {"t": "mc", "s": "y = −3x + 2", "prompt": "Does this line go up or down from left to right?", "ch": ["Down", "Up", "Flat", "Straight up and down"], "a": 0, "ex": "The slope is −3, negative, so it goes down.", "why": ["", "A negative slope goes down.", "Flat lines have a slope of 0.", "That only happens when x equals a number, like x = 2."]}, {"t": "mc", "s": "", "prompt": "A line has a slope of 2 and crosses the y axis at −5. What is its equation?", "ch": ["y = 2x − 5", "y = −5x + 2", "y = 2x + 5", "y = −2x − 5"], "a": 0, "ex": "m is 2 and b is −5, so y = 2x − 5.", "why": ["", "That swaps them. The slope goes with x.", "The y-intercept is negative 5.", "The slope is positive 2."]}]}, {"id": "al4", "name": "Functions", "lesson": [{"h": "A function is a machine", "say": "A function takes an input and gives back exactly one output. f of 3 means: put 3 in for x.", "tip": "", "steps": ["f(x) = 2x + 1", "f(3) = 2(3) + 1", "f(3) = 7"]}, {"h": "Domain and range", "say": "The domain is all the inputs, the x values. The range is all the outputs, the y values.", "tip": "Domain goes in, range comes out. D comes before R, just like in comes before out."}, {"h": "Is it a function?", "say": "Each input can only have one output. If the same x gives two different y's, it's not a function. Like a jersey: each player gets only one number.", "tip": "Vertical line test: if a straight-up line hits the graph twice, it's not a function."}], "q": [{"t": "mc", "s": "", "prompt": "If f(x) = 3x − 2, what is f(4)?", "ch": ["10", "14", "12", "5"], "a": 0, "ex": "Put 4 in for x: 3 times 4 is 12, minus 2 is 10.", "why": ["", "3 times 4 is 12, then subtract 2.", "Don't forget the minus 2.", "Put 4 in for x, then multiply by 3."]}, {"t": "mc", "s": "", "prompt": "If g(x) = x² + 1, what is g(3)?", "ch": ["10", "7", "9", "16"], "a": 0, "ex": "3 squared is 3 times 3, which is 9. Plus 1 is 10.", "why": ["", "x squared means 3 times 3, not 3 times 2.", "Don't forget to add the 1.", "Square the 3 first, then add 1."]}, {"t": "mc", "s": "", "prompt": "Which set of points is a function?", "ch": ["(1, 2), (2, 4), (3, 6)", "(1, 2), (1, 5), (3, 6)", "(4, 0), (4, 1), (4, 2)", "(2, 3), (5, 1), (2, 7)"], "a": 0, "ex": "Every x is different, so each input has only one output.", "why": ["", "The input 1 has two outputs, 2 and 5.", "The input 4 has three outputs.", "The input 2 has two outputs, 3 and 7."]}, {"t": "mc", "s": "(1, 5), (2, 8), (3, 11)", "prompt": "What is the domain of these points?", "ch": ["{1, 2, 3}", "{5, 8, 11}", "{1, 2, 3, 5, 8, 11}", "{3}"], "a": 0, "ex": "The domain is the x values, the first number in each pair.", "why": ["", "Those are the y values. That's the range.", "The domain is only the x values.", "There are three x values, 1, 2, and 3."]}, {"t": "mc", "s": "(1, 5), (2, 8), (3, 11)", "prompt": "What is the range of these points?", "ch": ["{5, 8, 11}", "{1, 2, 3}", "{1, 5}", "{11}"], "a": 0, "ex": "The range is the y values, the second number in each pair.", "why": ["", "Those are the x values. That's the domain.", "That's just the first point.", "The range has all three y values."]}, {"t": "mc", "s": "", "prompt": "A DJ charges $50 plus $20 per hour: f(h) = 20h + 50. What is f(3)?", "ch": ["$110", "$73", "$150", "$60"], "a": 0, "ex": "20 times 3 is 60, plus 50 is 110.", "why": ["", "Multiply 20 by 3. Don't just add 3.", "Only the 20 gets multiplied by the hours.", "Add the $50 setup fee."]}, {"t": "mc", "s": "", "prompt": "If f(x) = 2x + 5, which input gives an output of 17?", "ch": ["6", "39", "11", "7"], "a": 0, "ex": "2 times 6 is 12, plus 5 is 17.", "why": ["", "f(39) is 83, way too big.", "f(11) is 27.", "f(7) is 19."]}, {"t": "mc", "s": "", "prompt": "A video's views double every day. Is that linear or exponential?", "ch": ["Exponential", "Linear", "Neither", "Both"], "a": 0, "ex": "Doubling means multiplying by the same number each day. That's exponential. Linear adds the same amount each day.", "why": ["", "Linear adds the same amount. Doubling multiplies.", "It's a clear pattern: times 2 every day.", "It can only be one. Multiplying is exponential."]}]}, {"id": "al5", "name": "Systems of Equations", "lesson": [{"h": "Two lines, one answer", "say": "A system is two equations at the same time. The answer is the point where the lines cross, because it works for both.", "tip": "Here the lines cross at the point 2, 3.", "vis": {"graph": {"lines": [[1, 1], [-1, 5]], "pts": [[2, 3]]}}}, {"h": "Substitution", "say": "If one equation tells you what y equals, sub it into the other one. Like a sub coming off the bench into the game.", "tip": "", "steps": ["y = 2x and x + y = 12", "x + 2x = 12", "3x = 12, so x = 4", "y = 2(4) = 8"]}, {"h": "Elimination", "say": "Add or subtract the two equations so one letter disappears.", "tip": "", "steps": ["x + y = 10 and x − y = 4", "Add them: 2x = 14", "x = 7", "7 + y = 10, so y = 3"]}], "q": [{"t": "mc", "s": "y = x + 1 and y = 2x − 1", "prompt": "Is (2, 3) a solution to both equations?", "ch": ["Yes", "No, only the first", "No, only the second", "No, neither"], "a": 0, "ex": "First: 2 plus 1 is 3. Second: 2 times 2 minus 1 is 3. It works in both.", "why": ["", "Check the second one: 2 times 2 minus 1 is 3. It works too.", "Check the first one: 2 plus 1 is 3. It works too.", "Plug it in: both give 3."]}, {"t": "mc", "s": "y = 3x and x + y = 16", "prompt": "Solve the system. What is x?", "ch": ["4", "12", "16", "5"], "a": 0, "ex": "Sub 3x in for y: x + 3x = 16, so 4x = 16 and x = 4.", "why": ["", "12 is y. x is 4.", "16 is the total of x and y.", "Check: 5 plus 15 is 20, not 16."]}, {"t": "mc", "s": "x + y = 10 and x − y = 2", "prompt": "Solve the system. What is x?", "ch": ["6", "4", "5", "8"], "a": 0, "ex": "Add the equations: 2x = 12, so x = 6.", "why": ["", "4 is y.", "Check: 5 plus 5 is 10, but 5 minus 5 is 0, not 2.", "Check: 8 plus 2 is 10, but 8 minus 2 is 6, not 2."]}, {"t": "mc", "s": "", "prompt": "Where do these two lines cross?", "ch": ["(2, 2)", "(0, 4)", "(0, 0)", "(4, 0)"], "a": 0, "ex": "The lines y = x and y = −x + 4 meet at (2, 2).", "why": ["", "That's only where one line crosses the y axis.", "Only one line goes through (0, 0).", "Only one line goes through (4, 0)."], "vis": {"graph": {"lines": [[1, 0], [-1, 4]], "pts": [[2, 2]]}}}, {"t": "mc", "s": "", "prompt": "Adult tickets are $10 and student tickets are $5. They sold 30 tickets for $200. Which equations fit?", "ch": ["a + s = 30 and 10a + 5s = 200", "a + s = 200 and 10a + 5s = 30", "10a + s = 30 and a + 5s = 200", "a − s = 30 and 10a − 5s = 200"], "a": 0, "ex": "The tickets add up to 30. The money adds up to 200.", "why": ["", "That mixes them up. 30 is the number of tickets.", "Count tickets in one equation and dollars in the other.", "Add the tickets, don't subtract."]}, {"t": "mc", "s": "", "prompt": "Same game: a + s = 30 and 10a + 5s = 200. How many adult tickets sold?", "ch": ["10", "20", "15", "30"], "a": 0, "ex": "10 adults and 20 students: 100 plus 100 is 200 dollars.", "why": ["", "20 is the number of student tickets.", "Check: 15 times 10 plus 15 times 5 is 225, not 200.", "30 is all the tickets."]}, {"t": "mc", "s": "", "prompt": "Two lines have the same slope but different y-intercepts. How many times do they cross?", "ch": ["Never, so no solution", "Once", "Twice", "At every point"], "a": 0, "ex": "Same slope means parallel lines. They never meet.", "why": ["", "Only lines with different slopes cross once.", "Straight lines can't cross twice.", "That only happens if they're the exact same line."]}, {"t": "order", "prompt": "Put the steps in order to solve y = x + 2 and 2x + y = 11.", "items": ["2x + (x + 2) = 11", "3x + 2 = 11", "x = 3", "y = 3 + 2 = 5"], "ex": "Sub in for y, combine, solve for x, then find y."}]}, {"id": "al6", "name": "Exponents & Polynomials", "lesson": [{"h": "Exponents mean repeat", "say": "2 to the 3rd power means 2 times 2 times 2, which is 8. The small number tells you how many times.", "tip": "It's not 2 times 3. That's the most common mistake.", "steps": ["2³ = 2 × 2 × 2", "2³ = 8"]}, {"h": "Exponent rules", "say": "Multiplying? Add the exponents. Dividing? Subtract them. Power to a power? Multiply them. Anything to the zero power is 1.", "tip": "", "steps": ["x² · x³ = x⁵", "x⁶ ÷ x² = x⁴", "(x²)³ = x⁶", "x⁰ = 1"]}, {"h": "Polynomials", "say": "A polynomial is terms added together, like 3x² + 2x − 5. Combine like terms: x squared with x squared, x with x, numbers with numbers.", "tip": "", "steps": ["(2x² + 3x) + (x² − x)", "3x² + 2x"]}], "q": [{"t": "mc", "s": "", "prompt": "What is 3⁴?", "ch": ["81", "12", "7", "64"], "a": 0, "ex": "3 times 3 times 3 times 3 is 81.", "why": ["", "That's 3 times 4. 3 to the 4th means four 3's multiplied.", "That adds 3 and 4.", "That's 4 times 4 times 4."]}, {"t": "mc", "s": "x³ · x⁴", "prompt": "Simplify.", "ch": ["x⁷", "x¹²", "2x⁷", "x"], "a": 0, "ex": "Multiplying the same base: add the exponents. 3 plus 4 is 7.", "why": ["", "Add the exponents when multiplying. Don't multiply them.", "There's no 2 in front. It's one x times one x.", "The exponents add up to 7."]}, {"t": "mc", "s": "x⁸ ÷ x²", "prompt": "Simplify.", "ch": ["x⁶", "x⁴", "x¹⁰", "x¹⁶"], "a": 0, "ex": "Dividing the same base: subtract the exponents. 8 minus 2 is 6.", "why": ["", "Subtract the exponents: 8 minus 2, not 8 divided by 2.", "That adds. Dividing means subtract.", "That multiplies. Dividing means subtract."]}, {"t": "mc", "s": "", "prompt": "What is 5⁰?", "ch": ["1", "0", "5", "50"], "a": 0, "ex": "Anything except 0 to the zero power is 1.", "why": ["", "It's a rule: to the zero power always gives 1.", "To the zero power gives 1, not the number itself.", "That's not how exponents work. The answer is 1."]}, {"t": "mc", "s": "(3x + 2) + (x − 5)", "prompt": "Simplify.", "ch": ["4x − 3", "3x − 3", "4x + 7", "4x − 7"], "a": 0, "ex": "3x plus x is 4x. 2 minus 5 is −3.", "why": ["", "3x plus 1x is 4x.", "2 plus negative 5 is negative 3.", "2 minus 5 is −3, not −7."]}, {"t": "mc", "s": "x(x + 4)", "prompt": "Multiply.", "ch": ["x² + 4x", "2x + 4", "x² + 4", "5x"], "a": 0, "ex": "Distribute: x times x is x squared, and x times 4 is 4x.", "why": ["", "x times x is x squared, not 2x.", "Multiply the x by the 4 too.", "x times x is x squared. Those can't combine with 4x."]}, {"t": "mc", "s": "x² + 5x + 6", "prompt": "Factor.", "ch": ["(x + 2)(x + 3)", "(x + 1)(x + 6)", "(x + 5)(x + 1)", "(x − 2)(x − 3)"], "a": 0, "ex": "Find two numbers that multiply to 6 and add to 5. That's 2 and 3.", "why": ["", "1 and 6 multiply to 6, but they add to 7.", "5 and 1 multiply to 5, not 6.", "Negative 2 and negative 3 add to negative 5, not 5."]}, {"t": "mc", "s": "", "prompt": "A highlight clip has 100 views. The views triple every day. How many views after 2 days?", "ch": ["900", "600", "300", "2,700"], "a": 0, "ex": "Day 1: 100 times 3 is 300. Day 2: 300 times 3 is 900.", "why": ["", "Tripling twice is times 3, then times 3 again. That's times 9, not times 6.", "That's only after 1 day.", "That's after 3 days."]}]}, {"id": "al7", "name": "Quadratics", "lesson": [{"h": "The parabola", "say": "A quadratic has an x squared in it, like y = x². Its graph is a U shape called a parabola. It's the path of a jump shot: up, then down.", "tip": "If the number in front of x squared is negative, the U flips upside down.", "vis": {"graph": {"lines": [], "pts": [], "quad": [-0.5, 0, 4]}}}, {"h": "Vertex and zeros", "say": "The vertex is the very top or bottom point, like the peak of a jump shot. The zeros are where the graph crosses the x axis, where the ball would hit the floor.", "tip": "This one's vertex is at 0, negative 4. Its zeros are at 2 and negative 2.", "vis": {"graph": {"lines": [], "pts": [[0, -4], [-2, 0], [2, 0]], "quad": [1, 0, -4]}}}, {"h": "Solve by factoring", "say": "If two things multiply to zero, one of them has to be zero. So factor, then set each part equal to zero.", "tip": "", "steps": ["x² − 9 = 0", "(x − 3)(x + 3) = 0", "x = 3 or x = −3"]}], "q": [{"t": "mc", "s": "", "prompt": "Which one is a quadratic?", "ch": ["y = x² + 2x", "y = 2x + 1", "y = 3", "y = 2ˣ"], "a": 0, "ex": "A quadratic has x squared as its biggest power.", "why": ["", "That's linear. There's no x squared.", "That's a flat line.", "That's exponential. The x is up in the exponent."]}, {"t": "mc", "s": "y = −x² + 4", "prompt": "Does this parabola open up or down?", "ch": ["Down", "Up", "Sideways", "It's a straight line"], "a": 0, "ex": "The number in front of x squared is negative, so the U flips into a frown.", "why": ["", "It would open up if x squared were positive.", "Parabolas from y = something open up or down.", "It has x squared, so it's a curve."]}, {"t": "mc", "s": "x² = 25", "prompt": "Solve.", "ch": ["x = 5 or x = −5", "x = 5 only", "x = 12.5", "x = 625"], "a": 0, "ex": "5 times 5 is 25, and negative 5 times negative 5 is also 25.", "why": ["", "Don't forget the negative one: −5 times −5 is also 25.", "That divides by 2. Take the square root instead.", "That squares 25. Take the square root instead."]}, {"t": "mc", "s": "(x − 4)(x + 1) = 0", "prompt": "Solve.", "ch": ["x = 4 or x = −1", "x = −4 or x = 1", "x = 4 or x = 1", "x = −4 or x = −1"], "a": 0, "ex": "Set each part to zero: x − 4 = 0 gives 4, and x + 1 = 0 gives −1.", "why": ["", "The signs flip. x − 4 = 0 means x is positive 4.", "x + 1 = 0 means x is negative 1.", "x − 4 = 0 means x is positive 4."]}, {"t": "mc", "s": "x² + 7x + 12 = 0", "prompt": "Factor and solve.", "ch": ["x = −3 or x = −4", "x = 3 or x = 4", "x = −2 or x = −6", "x = 3 or x = −4"], "a": 0, "ex": "3 and 4 multiply to 12 and add to 7: (x + 3)(x + 4) = 0. So x = −3 or x = −4.", "why": ["", "The factors are (x + 3)(x + 4). Set each to zero and the signs flip.", "2 and 6 multiply to 12 but add to 8, not 7.", "Both signs flip, so both answers are negative."]}, {"t": "mc", "s": "", "prompt": "Where does this parabola cross the x axis?", "ch": ["x = −2 and x = 2", "x = −4", "x = −4 and x = 4", "x = 0"], "a": 0, "ex": "It hits the x axis at negative 2 and 2.", "why": ["", "−4 is where it crosses the y axis. That's the vertex.", "Look where the curve touches the flat x axis.", "At x = 0 the curve is down at −4."], "vis": {"graph": {"lines": [], "pts": [], "quad": [1, 0, -4]}}}, {"t": "mc", "s": "y = x² − 4", "prompt": "What is the vertex of this parabola?", "ch": ["(0, −4)", "(−4, 0)", "(2, 0)", "(0, 4)"], "a": 0, "ex": "The lowest point is at x = 0, y = −4.", "why": ["", "The x and y are swapped.", "That's a zero, where it crosses the x axis.", "It's below the x axis, so y is negative."], "vis": {"graph": {"lines": [], "pts": [], "quad": [1, 0, -4]}}}, {"t": "mc", "s": "", "prompt": "A football's height is h = −16t² + 64. When does it hit the ground, where h = 0?", "ch": ["t = 2 seconds", "t = 4 seconds", "t = 64 seconds", "t = 16 seconds"], "a": 0, "ex": "16t² = 64, so t² = 4. The square root of 4 is 2.", "why": ["", "t² is 4. Take the square root to get t = 2.", "64 is the starting height.", "16 is part of the gravity number."]}]}]}, {"id": "bi", "name": "Biology", "icon": "bi4", "boss": "bi-boss", "units": [{"id": "bi1", "name": "Cells", "lesson": [{"h": "Cells are the starting lineup", "say": "Bayo, every living thing is made of cells. The cell is the smallest unit of life. Your body has trillions of them.", "tip": "Psalm 139 says we are fearfully and wonderfully made. Cells are a big part of that design."}, {"h": "Every part has a position", "say": "The nucleus is the coach: it holds the DNA playbook. The mitochondria are the power: they make energy. The cell membrane is security: it controls what goes in and out. Ribosomes build proteins.", "tip": "", "steps": ["Nucleus: holds the DNA", "Mitochondria: make energy", "Cell membrane: controls in and out", "Ribosomes: build proteins"]}, {"h": "Plant cells have extras", "say": "Plant cells have three extras: a cell wall for strength, chloroplasts to make food from sunlight, and a big vacuole to store water.", "tip": ""}, {"h": "Two kinds of cells", "say": "Prokaryotes, like bacteria, have no nucleus. Eukaryotes, like plants, animals, and you, have a nucleus.", "tip": "Eu sounds like do: eukaryotes do have a nucleus."}], "q": [{"t": "mc", "s": "", "prompt": "Which part of the cell holds the DNA?", "ch": ["Nucleus", "Mitochondria", "Cell membrane", "Ribosome"], "a": 0, "ex": "The nucleus is the coach's office. The DNA playbook lives there.", "why": ["", "Mitochondria make energy.", "The membrane controls what goes in and out.", "Ribosomes build proteins."]}, {"t": "mc", "s": "", "prompt": "Which part makes energy for the cell?", "ch": ["Mitochondria", "Nucleus", "Cell wall", "Vacuole"], "a": 0, "ex": "Mitochondria are the powerhouse. They turn food into energy.", "why": ["", "The nucleus holds DNA.", "The cell wall gives plants strength.", "The vacuole stores water."]}, {"t": "mc", "s": "", "prompt": "Which part controls what goes in and out of the cell?", "ch": ["Cell membrane", "Nucleus", "Ribosome", "Chloroplast"], "a": 0, "ex": "The cell membrane is security at the door.", "why": ["", "The nucleus holds DNA.", "Ribosomes build proteins.", "Chloroplasts make food from sunlight."]}, {"t": "mc", "s": "", "prompt": "Which part is in plant cells but not animal cells?", "ch": ["Chloroplast", "Mitochondria", "Nucleus", "Cell membrane"], "a": 0, "ex": "Chloroplasts capture sunlight. Animals don't have them.", "why": ["", "Both plants and animals have mitochondria.", "Both plant and animal cells have a nucleus.", "Every cell has a membrane."]}, {"t": "mc", "s": "", "prompt": "Bacteria are prokaryotes. That means they have no...", "ch": ["Nucleus", "DNA", "Cell membrane", "Ribosomes"], "a": 0, "ex": "Prokaryotes have no nucleus.", "why": ["", "Bacteria do have DNA. It just floats in the cell.", "Bacteria have a cell membrane.", "Bacteria have ribosomes to make proteins."]}, {"t": "mc", "s": "", "prompt": "What do ribosomes build?", "ch": ["Proteins", "Sugar", "Water", "Sunlight"], "a": 0, "ex": "Ribosomes are the builders. They put together proteins.", "why": ["", "Plants make sugar in chloroplasts.", "Ribosomes don't make water.", "Sunlight comes from the sun."]}, {"t": "order", "prompt": "Put these in order from smallest to biggest.", "items": ["Cell", "Tissue", "Organ", "Organ system", "Organism"], "ex": "Cells make tissues, tissues make organs, organs make systems, and systems make a whole organism, like you."}, {"t": "mc", "s": "", "prompt": "Bayo sweats to cool down after a hard practice. This is an example of...", "ch": ["Homeostasis", "Photosynthesis", "Mitosis", "Mutation"], "a": 0, "ex": "Homeostasis means keeping your body steady inside, like keeping your temperature normal.", "why": ["", "Photosynthesis is how plants make food.", "Mitosis is cells dividing.", "A mutation is a change in DNA."]}]}, {"id": "bi2", "name": "Molecules of Life", "lesson": [{"h": "The big four", "say": "Living things are built from four big molecules: carbohydrates, lipids, proteins, and nucleic acids.", "tip": "", "steps": ["Carbohydrates", "Lipids", "Proteins", "Nucleic acids"]}, {"h": "What each one does", "say": "Carbohydrates, like pasta and bread, give quick energy. Lipids, like fats and oils, store energy for later. Proteins build muscle and do jobs. Nucleic acids, DNA and RNA, carry the instructions.", "tip": "Carb-loading before a game is all about quick energy."}, {"h": "Enzymes", "say": "Enzymes are proteins that speed up chemical reactions. Each enzyme fits one job, like a key fits one lock. Too much heat or the wrong pH changes their shape, and they stop working.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "Bayo eats pasta before a game for quick energy. Pasta is mostly...", "ch": ["Carbohydrates", "Lipids", "Proteins", "Nucleic acids"], "a": 0, "ex": "Pasta and bread are carbohydrates, the quick-energy fuel.", "why": ["", "Lipids are fats and oils.", "Proteins come from foods like chicken, eggs, and beans.", "Nucleic acids are DNA and RNA."]}, {"t": "mc", "s": "", "prompt": "Which molecule builds muscle?", "ch": ["Proteins", "Carbohydrates", "Lipids", "Water"], "a": 0, "ex": "Proteins build and repair muscle.", "why": ["", "Carbs are quick energy.", "Lipids store energy.", "Water is important, but it doesn't build muscle."]}, {"t": "mc", "s": "", "prompt": "DNA is a...", "ch": ["Nucleic acid", "Lipid", "Carbohydrate", "Enzyme"], "a": 0, "ex": "DNA and RNA are the nucleic acids. They carry instructions.", "why": ["", "Lipids are fats and oils.", "Carbohydrates are sugars and starches.", "Enzymes are proteins that speed up reactions."]}, {"t": "mc", "s": "", "prompt": "Fats and oils are...", "ch": ["Lipids", "Proteins", "Carbohydrates", "Nucleic acids"], "a": 0, "ex": "Lipids are fats and oils. They store energy.", "why": ["", "Proteins build muscle.", "Carbs are sugars and starches.", "Nucleic acids are DNA and RNA."]}, {"t": "mc", "s": "", "prompt": "What do enzymes do?", "ch": ["Speed up chemical reactions", "Store water", "Carry DNA", "Make sunlight"], "a": 0, "ex": "Enzymes speed up reactions, like a fast break speeds up a play.", "why": ["", "The vacuole stores water.", "The nucleus holds DNA.", "Only the sun makes sunlight."]}, {"t": "mc", "s": "", "prompt": "An enzyme gets too hot and changes shape. What happens?", "ch": ["It stops working well", "It works faster forever", "It turns into DNA", "Nothing changes"], "a": 0, "ex": "Shape is everything for an enzyme. Wrong shape, like a bent key, means it can't do its job.", "why": ["", "Too much heat breaks it, it doesn't speed it up.", "Enzymes are proteins. They don't turn into DNA.", "Its shape changed, so its job changes too."]}, {"t": "mc", "s": "", "prompt": "Enzymes are a type of...", "ch": ["Protein", "Lipid", "Carbohydrate", "Nucleic acid"], "a": 0, "ex": "Enzymes are proteins.", "why": ["", "Lipids are fats.", "Carbs are sugars.", "Nucleic acids are DNA and RNA."]}, {"t": "mc", "s": "", "prompt": "The building blocks of proteins are...", "ch": ["Amino acids", "Sugars", "Fatty acids", "Nucleotides"], "a": 0, "ex": "Proteins are chains of amino acids.", "why": ["", "Sugars build carbohydrates.", "Fatty acids build lipids.", "Nucleotides build DNA and RNA."]}]}, {"id": "bi3", "name": "Energy in Living Things", "lesson": [{"h": "Photosynthesis", "say": "Plants make their own food. In the chloroplast, they use sunlight, water, and carbon dioxide to make sugar. They give off oxygen.", "tip": "", "steps": ["sunlight + water + carbon dioxide", "→ sugar + oxygen"]}, {"h": "Cellular respiration", "say": "Your cells break down sugar with oxygen to release energy called ATP. This happens in the mitochondria. It gives off carbon dioxide and water.", "tip": "", "steps": ["sugar + oxygen", "→ energy (ATP) + carbon dioxide + water"]}, {"h": "They work as a team", "say": "Photosynthesis makes what respiration needs, and respiration makes what photosynthesis needs. Like a pass and a catch.", "tip": "Without enough oxygen, muscles make a little energy another way, called fermentation. That's the burn at the end of a long sprint."}], "q": [{"t": "mc", "s": "", "prompt": "Where does photosynthesis happen?", "ch": ["Chloroplast", "Mitochondria", "Nucleus", "Ribosome"], "a": 0, "ex": "Chloroplasts catch the sunlight.", "why": ["", "Mitochondria do respiration, not photosynthesis.", "The nucleus holds DNA.", "Ribosomes build proteins."]}, {"t": "mc", "s": "", "prompt": "Which gas do plants take in for photosynthesis?", "ch": ["Carbon dioxide", "Oxygen", "Nitrogen", "Helium"], "a": 0, "ex": "Plants take in carbon dioxide, the gas you breathe out.", "why": ["", "Plants give off oxygen.", "Nitrogen isn't used in photosynthesis.", "Helium is for balloons."]}, {"t": "mc", "s": "", "prompt": "What gas do plants give off in photosynthesis?", "ch": ["Oxygen", "Carbon dioxide", "Smoke", "Steam"], "a": 0, "ex": "Plants give off oxygen, the gas you breathe in.", "why": ["", "Plants take carbon dioxide in.", "Smoke comes from burning.", "Steam is hot water vapor."]}, {"t": "mc", "s": "", "prompt": "Where does cellular respiration happen?", "ch": ["Mitochondria", "Chloroplast", "Cell wall", "Vacuole"], "a": 0, "ex": "Mitochondria are the powerhouse where respiration happens.", "why": ["", "Chloroplasts do photosynthesis.", "The cell wall gives strength.", "The vacuole stores water."]}, {"t": "mc", "s": "", "prompt": "What is the energy molecule your cells use?", "ch": ["ATP", "DNA", "RNA", "Salt"], "a": 0, "ex": "ATP is the cell's energy. Think of it as cash the cell spends.", "why": ["", "DNA holds instructions.", "RNA carries copies of instructions.", "Salt isn't an energy molecule."]}, {"t": "order", "prompt": "Put the path of energy in order.", "items": ["Sunlight", "A plant makes sugar", "Bayo eats the plant", "Bayo's cells release energy"], "ex": "Energy starts with the sun, goes into plants, then into you."}, {"t": "mc", "s": "", "prompt": "At the end of a long sprint, Bayo's muscles burn because they're low on oxygen. What process is that?", "ch": ["Fermentation", "Photosynthesis", "Mitosis", "Digestion"], "a": 0, "ex": "Without enough oxygen, muscles use fermentation. It makes a little energy and causes the burn.", "why": ["", "Photosynthesis happens in plants.", "Mitosis is cells dividing.", "Digestion breaks down food in your stomach."]}, {"t": "mc", "s": "", "prompt": "Which is made by cellular respiration?", "ch": ["Carbon dioxide", "Sunl
