ight", "Chlorophyll", "Glucose"], "a": 0, "ex": "Respiration gives off carbon dioxide, water, and energy.", "why": ["", "Sunlight comes from the sun.", "Chlorophyll is the green stuff in plants.", "Glucose is sugar. Respiration uses it up."]}]}, {"id": "bi4", "name": "DNA & Cell Division", "lesson": [{"h": "DNA is the playbook", "say": "DNA holds the instructions for building you. It's shaped like a twisted ladder called a double helix.", "tip": "Memory trick: Apple in the Tree, Car in the Garage.", "steps": ["A pairs with T", "C pairs with G"]}, {"h": "From DNA to protein", "say": "DNA gets copied into RNA. That's transcription. Then a ribosome reads the RNA and builds a protein. That's translation.", "tip": "", "steps": ["DNA", "→ RNA (transcription)", "→ protein (translation)"]}, {"h": "Mitosis", "say": "Mitosis is how one cell splits into two identical cells. It's how you grow and how cuts heal.", "tip": "Meiosis is different. It makes egg and sperm cells with half the DNA."}, {"h": "Mutations", "say": "A mutation is a change in the DNA. Some do nothing, some cause problems, and a few help.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "The shape of DNA is called a...", "ch": ["Double helix", "Triangle", "Single circle", "Cube"], "a": 0, "ex": "DNA is a double helix, a twisted ladder.", "why": ["", "DNA is a twisted ladder, not a triangle.", "DNA is two strands twisted together, not one circle.", "DNA isn't a cube."]}, {"t": "mc", "s": "", "prompt": "In DNA, A pairs with...", "ch": ["T", "G", "C", "A"], "a": 0, "ex": "Apple in the Tree: A pairs with T.", "why": ["", "G pairs with C.", "C pairs with G.", "A doesn't pair with itself."]}, {"t": "mc", "s": "", "prompt": "In DNA, C pairs with...", "ch": ["G", "T", "A", "C"], "a": 0, "ex": "Car in the Garage: C pairs with G.", "why": ["", "T pairs with A.", "A pairs with T.", "C doesn't pair with itself."]}, {"t": "mc", "s": "", "prompt": "One side of DNA reads A T G C. What does the other side read?", "ch": ["T A C G", "A T G C", "G C A T", "U A C G"], "a": 0, "ex": "Swap each letter for its partner: A to T, T to A, G to C, C to G.", "why": ["", "That's the same side. Use the partners.", "Pair each letter: A with T, C with G.", "U only shows up in RNA, not DNA."]}, {"t": "order", "prompt": "Put the steps from DNA to protein in order.", "items": ["DNA", "RNA copy", "Ribosome reads it", "Protein"], "ex": "DNA is copied into RNA, then a ribosome reads it to build a protein."}, {"t": "mc", "s": "", "prompt": "Mitosis makes...", "ch": ["Two identical cells", "Four different cells", "One bigger cell", "Proteins"], "a": 0, "ex": "Mitosis splits one cell into two exact copies.", "why": ["", "That's meiosis, which makes egg and sperm cells.", "Mitosis splits the cell, it doesn't grow it.", "Ribosomes make proteins."]}, {"t": "mc", "s": "", "prompt": "Bayo cuts his hand and it heals. Which process made the new skin cells?", "ch": ["Mitosis", "Meiosis", "Photosynthesis", "Fermentation"], "a": 0, "ex": "Mitosis makes new body cells to heal the cut.", "why": ["", "Meiosis only makes egg and sperm cells.", "Photosynthesis is how plants make food.", "Fermentation makes energy without oxygen."]}, {"t": "mc", "s": "", "prompt": "A change in DNA is called a...", "ch": ["Mutation", "Protein", "Vacuole", "Enzyme"], "a": 0, "ex": "A mutation is any change in DNA.", "why": ["", "Proteins are built from DNA's instructions.", "A vacuole stores water.", "An enzyme speeds up reactions."]}]}, {"id": "bi5", "name": "Heredity", "lesson": [{"h": "Genes come in pairs", "say": "You get one copy of each gene from each parent. The different versions of a gene are called alleles.", "tip": ""}, {"h": "Dominant and recessive", "say": "A dominant allele, written with a capital letter, shows up even if you only have one. A recessive allele, written lowercase, only shows up if you have two.", "tip": "Capital B is like the starter. Lowercase b only plays if there's no starter."}, {"h": "Punnett squares", "say": "A Punnett square predicts what the kids might get. Put one parent across the top and the other down the side. Fill in each box with one letter from each.", "tip": "Bb times Bb gives 1 BB, 2 Bb, and 1 bb. So 3 out of 4 show the dominant trait.", "vis": {"punnett": ["Bb", "Bb"]}}, {"h": "Genotype and phenotype", "say": "Genotype is the letters, like Bb. Phenotype is what you actually see, like brown eyes.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "Which allele is dominant?", "ch": ["B", "b", "Both", "Neither"], "a": 0, "ex": "Capital letters are dominant.", "why": ["", "Lowercase letters are recessive.", "Only the capital one is dominant.", "The capital B is dominant."]}, {"t": "mc", "s": "", "prompt": "Look at the Punnett square. How many kids out of 4 will be bb?", "ch": ["2 out of 4", "1 out of 4", "3 out of 4", "None"], "a": 0, "ex": "Two boxes are Bb and two boxes are bb.", "why": ["", "Count the bb boxes. There are two.", "Only 2 boxes have bb.", "Two boxes have bb."], "vis": {"punnett": ["Bb", "bb"]}}, {"t": "mc", "s": "", "prompt": "Look at the Punnett square. What will every kid be?", "ch": ["Bb", "BB", "bb", "Half BB, half bb"], "a": 0, "ex": "Every box gets one B from the first parent and one b from the second.", "why": ["", "The second parent can only give b.", "The first parent can only give B.", "Every box ends up the same: Bb."], "vis": {"punnett": ["BB", "bb"]}}, {"t": "mc", "s": "", "prompt": "T means tall and is dominant. A plant is Tt. Is it tall or short?", "ch": ["Tall", "Short", "Medium", "You can't tell"], "a": 0, "ex": "One dominant T is enough. The plant is tall.", "why": ["", "Short needs two lowercase t's.", "Dominant wins. It's not a mix.", "One capital T means tall."]}, {"t": "mc", "s": "", "prompt": "Two matching letters, like BB or bb, are called...", "ch": ["Homozygous", "Heterozygous", "Recessive", "A mutation"], "a": 0, "ex": "Homo means same. Same letters.", "why": ["", "Hetero means different, like Bb.", "Recessive is just the lowercase one.", "A mutation is a change in DNA."]}, {"t": "mc", "s": "", "prompt": "Look at the Punnett square. How many kids out of 4 show the recessive trait?", "ch": ["1 out of 4", "2 out of 4", "3 out of 4", "4 out of 4"], "a": 0, "ex": "Only the bb box shows the recessive trait.", "why": ["", "Bb shows the dominant trait. Only bb is recessive.", "3 out of 4 show the dominant trait.", "Only one box is bb."], "vis": {"punnett": ["Bb", "Bb"]}}, {"t": "mc", "s": "", "prompt": "Brown eyes is an example of a...", "ch": ["Phenotype", "Genotype", "Allele", "Punnett square"], "a": 0, "ex": "What you can see is the phenotype.", "why": ["", "Genotype is the letters, like Bb.", "An allele is one version of a gene.", "A Punnett square is a prediction chart."]}, {"t": "mc", "s": "", "prompt": "Where do your alleles come from?", "ch": ["One from each parent", "Both from your mom", "Both from your dad", "You make them yourself"], "a": 0, "ex": "You get one from your mom and one from your dad.", "why": ["", "Your dad gives you one too.", "Your mom gives you one too.", "You get them from your parents."]}]}, {"id": "bi6", "name": "Ecosystems", "lesson": [{"h": "Food chains", "say": "Energy moves from the sun to plants, to animals that eat plants, to animals that eat animals. Plants are producers. Animals are consumers. Mushrooms and bacteria are decomposers: they break down dead things.", "tip": "", "steps": ["Sun", "→ grass (producer)", "→ rabbit (consumer)", "→ hawk (consumer)"]}, {"h": "The 10 percent rule", "say": "Only about 10 percent of the energy moves up each level. The rest is lost as heat. That's why there are way fewer hawks than rabbits.", "tip": "", "steps": ["Grass: 10,000 units", "Rabbit: 1,000 units", "Hawk: 100 units"]}, {"h": "Nature recycles", "say": "Matter gets used again and again. In the carbon cycle, plants take in carbon dioxide and animals breathe it out. Water cycles too.", "tip": "", "steps": ["Evaporation", "Condensation", "Precipitation", "Collection"]}, {"h": "Limits", "say": "Every habitat can only hold so many of one kind of living thing. That limit is called the carrying capacity. Food, water, and space are limiting factors.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "In a food chain, grass is a...", "ch": ["Producer", "Consumer", "Decomposer", "Predator"], "a": 0, "ex": "Grass makes its own food from sunlight, so it's a producer.", "why": ["", "Consumers eat other things.", "Decomposers break down dead things.", "Predators hunt animals."]}, {"t": "mc", "s": "", "prompt": "Mushrooms that break down a dead log are...", "ch": ["Decomposers", "Producers", "Predators", "Herbivores"], "a": 0, "ex": "Decomposers break down dead things and recycle them.", "why": ["", "Producers make food from sunlight.", "Predators hunt.", "Herbivores eat plants."]}, {"t": "mc", "s": "", "prompt": "Grass has 10,000 units of energy. About how much reaches the rabbit?", "ch": ["1,000", "10,000", "100", "5,000"], "a": 0, "ex": "About 10 percent moves up. 10 percent of 10,000 is 1,000.", "why": ["", "Most of the energy is lost as heat.", "100 is what reaches the next level up, like a hawk.", "Only about 10 percent moves up, not half."]}, {"t": "order", "prompt": "Put this food chain in order.", "items": ["Sun", "Grass", "Grasshopper", "Frog", "Snake"], "ex": "The sun feeds the grass, the grasshopper eats grass, the frog eats the grasshopper, and the snake eats the frog."}, {"t": "mc", "s": "", "prompt": "Why are there fewer top predators than plants?", "ch": ["Only about 10% of the energy passes up each level", "Predators don't need energy", "Predators live forever", "Plants eat predators"], "a": 0, "ex": "Less energy at the top means fewer animals can live there.", "why": ["", "Every living thing needs energy.", "Predators don't live forever.", "Plants don't eat predators."]}, {"t": "mc", "s": "", "prompt": "The most of one kind of living thing a habitat can hold is the...", "ch": ["Carrying capacity", "Food chain", "Water cycle", "Mutation"], "a": 0, "ex": "Carrying capacity is the limit.", "why": ["", "A food chain shows who eats who.", "The water cycle moves water around.", "A mutation is a change in DNA."]}, {"t": "mc", "s": "", "prompt": "Which one is a limiting factor for a deer population?", "ch": ["Amount of food", "The day of the week", "The color of the sky", "The name of the forest"], "a": 0, "ex": "Food, water, and space limit how many can live there.", "why": ["", "Days of the week don't affect deer.", "Sky color doesn't limit deer.", "A name doesn't feed anything."]}, {"t": "order", "prompt": "Put the water cycle in order.", "items": ["Evaporation", "Condensation", "Precipitation", "Collection"], "ex": "Water evaporates, forms clouds, falls as rain, and collects. Then it starts again."}]}, {"id": "bi7", "name": "Natural Selection", "lesson": [{"h": "Variation", "say": "No two players are exactly alike. In every group of living things, there are small differences. These are called variations.", "tip": ""}, {"h": "Natural selection", "say": "Living things with traits that help them survive are more likely to live and have offspring. They pass those traits on, so the traits become more common over many generations.", "tip": "", "steps": ["Variation", "Competition", "Survival", "Passing on traits"]}, {"h": "Adaptations", "say": "An adaptation is a trait that helps a living thing survive where it lives, like a polar bear's thick fur or a cactus storing water.", "tip": ""}, {"h": "Evidence", "say": "Scientists look at fossils, DNA, and body structures to study how living things change over time.", "tip": "Bacteria that survive an antibiotic can pass that on. That's why you finish the whole prescription."}], "q": [{"t": "mc", "s": "", "prompt": "A trait that helps a living thing survive is an...", "ch": ["Adaptation", "Allele", "Organ", "Enzyme"], "a": 0, "ex": "An adaptation helps it survive where it lives.", "why": ["", "An allele is a version of a gene.", "An organ is a body part, like the heart.", "An enzyme speeds up reactions."]}, {"t": "mc", "s": "", "prompt": "Small differences between members of a group are called...", "ch": ["Variations", "Producers", "Mutations only", "Cycles"], "a": 0, "ex": "Variations are the differences.", "why": ["", "Producers make food from sunlight.", "Mutations can cause some variation, but the differences are called variations.", "Cycles are things like the water cycle."]}, {"t": "mc", "s": "", "prompt": "Some bacteria survive an antibiotic and multiply. The new group is...", "ch": ["More resistant to the antibiotic", "Less resistant", "Exactly the same as before", "Gone"], "a": 0, "ex": "Only the survivors reproduced, so their resistance gets passed on.", "why": ["", "The weak ones died, so the group gets stronger against it.", "The survivors were different, so the group changes.", "Some survived and multiplied."]}, {"t": "order", "prompt": "Put the steps of natural selection in order.", "items": ["Variation", "Competition", "Survival", "Passing on traits"], "ex": "Differences, then a struggle, then the best fit survive and pass on their traits."}, {"t": "mc", "s": "", "prompt": "Trees turn dark from soot. Light moths are easy for birds to see. Over time, which moths become more common?", "ch": ["Dark moths", "Light moths", "Both the same", "Neither"], "a": 0, "ex": "Dark moths are hidden, survive more, and pass on the dark color.", "why": ["", "Light moths get eaten more, so there are fewer of them.", "The birds pick off more light moths.", "Dark moths still survive."]}, {"t": "mc", "s": "", "prompt": "Which is evidence scientists use to study change over time?", "ch": ["Fossils", "Weather reports", "Song lyrics", "Phone apps"], "a": 0, "ex": "Fossils show living things from long ago.", "why": ["", "Weather reports are about today's weather.", "Song lyrics aren't science evidence.", "Phone apps aren't evidence."]}, {"t": "mc", "s": "", "prompt": "Who passes on the most traits?", "ch": ["The ones that survive and have offspring", "Always the biggest ones", "Always the oldest ones", "Every one equally"], "a": 0, "ex": "You can only pass on traits if you survive and have offspring.", "why": ["", "Bigger isn't always better for survival.", "Age alone doesn't decide it.", "Some survive and some don't."]}, {"t": "mc", "s": "", "prompt": "Natural selection changes...", "ch": ["Populations over many generations", "One animal in one day", "Rocks", "Only plants"], "a": 0, "ex": "It works on whole groups over a long time.", "why": ["", "One animal doesn't change its DNA in a day.", "Rocks aren't alive.", "It works on all living things."]}]}]}, {"id": "wh", "name": "World History", "icon": "wh3", "boss": "wh-boss", "units": [{"id": "wh1", "name": "Age of Revolutions", "lesson": [{"h": "Kings with all the power", "say": "In the 1600s and 1700s, many kings had absolute power. They claimed divine right, meaning God picked them to rule. King Louis the 14th of France built the huge palace of Versailles.", "tip": ""}, {"h": "The Enlightenment", "say": "Thinkers started asking big questions. John Locke said people have natural rights: life, liberty, and property. Montesquieu said to split power into three branches. Rousseau said the government's power comes from the people.", "tip": "", "steps": ["Locke: natural rights", "Montesquieu: three branches", "Rousseau: power from the people"]}, {"h": "Revolutions", "say": "These ideas inspired the American Declaration of Independence in 1776 and the French Revolution in 1789. In France, people stormed a prison called the Bastille.", "tip": "In Haiti, Toussaint Louverture led enslaved people to freedom. In 1804, Haiti became the first free Black republic."}, {"h": "Napoleon", "say": "After the chaos in France, a general named Napoleon took over and made himself emperor in 1804. He conquered much of Europe, then lost for good at Waterloo in 1815.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "Divine right means a king...", "ch": ["Was chosen by God to rule", "Was elected by the people", "Shared power with Congress", "Had to follow a constitution"], "a": 0, "ex": "Kings said God chose them, so nobody could question them.", "why": ["", "Kings with divine right weren't elected.", "They didn't share power.", "Divine right kings didn't follow a constitution."]}, {"t": "mc", "s": "", "prompt": "Who said people have natural rights to life, liberty, and property?", "ch": ["John Locke", "Napoleon", "Louis the 14th", "Montesquieu"], "a": 0, "ex": "John Locke wrote about natural rights.", "why": ["", "Napoleon was a French general and emperor.", "Louis the 14th was a king with absolute power.", "Montesquieu wrote about three branches of government."]}, {"t": "mc", "s": "", "prompt": "Who said to split government into three branches?", "ch": ["Montesquieu", "Rousseau", "Locke", "Napoleon"], "a": 0, "ex": "Montesquieu wanted power split so no one person had it all.", "why": ["", "Rousseau said power comes from the people.", "Locke wrote about natural rights.", "Napoleon took power for himself."]}, {"t": "mc", "s": "", "prompt": "The French Revolution began in...", "ch": ["1789", "1776", "1815", "1914"], "a": 0, "ex": "The French Revolution began in 1789.", "why": ["", "1776 is the American Declaration of Independence.", "1815 is when Napoleon lost at Waterloo.", "1914 is when World War One started."]}, {"t": "order", "prompt": "Put these events in order.", "items": ["Enlightenment ideas spread", "American Revolution (1776)", "French Revolution (1789)", "Napoleon becomes emperor (1804)"], "ex": "The ideas came first, then America, then France, then Napoleon."}, {"t": "mc", "s": "", "prompt": "Napoleon's final defeat was at...", "ch": ["Waterloo", "Versailles", "Pearl Harbor", "The Bastille"], "a": 0, "ex": "Napoleon lost at Waterloo in 1815.", "why": ["", "Versailles is the palace of the French kings.", "Pearl Harbor was attacked in World War Two.", "The Bastille was a prison stormed in 1789."]}, {"t": "mc", "s": "", "prompt": "Which revolution created the first free Black republic?", "ch": ["The Haitian Revolution", "The French Revolution", "The Industrial Revolution", "The Russian Revolution"], "a": 0, "ex": "Haiti won its freedom in 1804, led at first by Toussaint Louverture.", "why": ["", "France stayed a European country with a king, then an emperor.", "The Industrial Revolution was about machines.", "The Russian Revolution was in 1917."]}, {"t": "mc", "s": "", "prompt": "The Magna Carta, from 1215, mattered because it...", "ch": ["Limited the king's power", "Started the French Revolution", "Made Napoleon emperor", "Invented the steam engine"], "a": 0, "ex": "The Magna Carta said even the king had to follow the law.", "why": ["", "The French Revolution started in 1789.", "Napoleon came more than 500 years later.", "The steam engine came hundreds of years later."]}]}, {"id": "wh2", "name": "Industrial Revolution", "lesson": [{"h": "From hands to machines", "say": "Starting in Britain in the late 1700s, work moved from hand tools at home to machines in factories. The steam engine powered factories and trains.", "tip": ""}, {"h": "Why Britain?", "say": "Britain had coal and iron, rivers and ports, money to invest, and lots of workers.", "tip": "", "steps": ["Coal and iron", "Rivers and ports", "Money", "Workers"]}, {"h": "City life", "say": "People moved from farms to cities for factory jobs. That's urbanization. Cities got crowded and dirty. Kids worked long hours in dangerous factories.", "tip": "Workers formed labor unions to fight for better pay and safer jobs."}, {"h": "New ideas about money", "say": "Capitalism: people own businesses and compete. Socialism: the community or government shares control. Communism, from Karl Marx: workers own everything and there are no classes.", "tip": ""}], "q": [{"t": "mc", "s": "", "prompt": "Where did the Industrial Revolution start?", "ch": ["Britain", "China", "Brazil", "Egypt"], "a": 0, "ex": "It started in Britai function loadVoices(){

  voices.sort((a,b) => rank(b) - rank(a));

/* speak(text, spans?) — spans: elements each with data-o (char offset in text) for word highlighting */
function speak(text, spans, btn){

  stop();
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.rate = S.rate; if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-US";
  let list = spans ? [...spans] : [];
  if (list.length && changes(text)) { const box = list[0].closest(".say,.sent,.step,.mathline") || list[0].parentElement; list = []; if (box) box.classList.add("reading"); }
  u.onboundary = e => { if (!list.length || e.name === "sentence") return; let hit = null; for (const s of list) { if (+s.dataset.o <= e.charIndex) hit = s; else break; }
    list.forEach(s => s.classList.remove("cur","speaking")); if (hit) hit.classList.add(hit.classList.contains("w")?"speaking":"cur"); };
  u.onend = u.onerror = () => clearHighlights();

function sayHTML(text){ return `<span class="say">${spansFrom(text,0)}</span>`; }

/* read several blocks one after another, each with its own highlighting */
function readSequence(els, btn){

    let list = [...el.querySelectorAll("[data-o]")]; const tx = el.dataset.text||el.textContent;
    if (changes(tx)) { list = []; el.classList.add("reading"); }
    u.onboundary = e => { if (e.name === "sentence") return; let hit = null; for (const s of list) { if (+s.dataset.o <= e.charIndex) hit = s; else break; } list.forEach(s=>s.classList.remove("cur","speaking")); if (hit) hit.classList.add(hit.classList.contains("w")?"speaking":"cur"); };

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------- tracking (time, per-subject stats, misses) + sync to the parent page ---------- */
let lastAct = 0;

function tick(){ const now = Date.now(); if (lastAct) dayRec().sec += Math.min(now - lastAct, 90000)/1000; lastAct = now; }
document.addEventListener("click", tick, true);
const SYNC_URL = "/api/progress", SYNC_TOKEN = "bayo-sync-v1"; let syncT = null, answered = 0;

function score(ok, q){

function feedback(ok, headExtra, whyWrong, why){

function answerTap(q, i, btn){

  let unlockHTML = "", unlockSay = "";
  if (!wasPassed && nowPassed) {
    if (!isBoss && unitI+1 < UNITS.length) { const nx = UNITS[unitI+1]; unlockHTML = `<div class="unlock">${art(nx.id,72)}<div><span class="pill">Unlocked</span><b>Level ${unitI+2}: ${esc(nx.name)}</b></div></div>`; unlockSay = ` Level ${unitI+2}, ${nx.name}, is unlocked.`; }
    if (!isBoss && !wasBossOpen && bossOpen()) { unlockHTML = `<div class="unlock">${art("boss",72)}<div><span class="pill">Unlocked</span><b>The Championship Game</b></div></div>`; unlockSay = " The Championship Game is unlocked."; }
    if (isBoss) unlockSay = " You won the championship!";
  }
  const rk = rankOf(S.points), rankUp = rk.i > rankBefore;
  if (rankUp) unlockSay += ` New rank: ${rk.r.name}.`;
  const msg = (pct>=0.7?"Bayo! ":"") + (!nowPassed ? `You need ${Math.ceil(PASS*qset.qs.length)} right to win this level. Run it back, you've got this.` : pct >= 0.9 ? (isBoss ? "Champion. That's a title run." : "Game over, and you won big.") : pct >= 0.7 ? "Strong game. A little more practice and it's three stars." : "You won the level. Run it back for more stars.");
  const party = nowPassed && (unlockSay || pct >= 0.9);
  const colors = ["var(--accent)","var(--noun)","var(--verb)","var(--adj)","var(--adv)","var(--pron)"];
  const burst = party ? `<div class="burst" aria-hidden="true">${Array.from({length:28},(_,k)=>`<i style="left:${(k*37)%100}%;background:${colors[k%6]};animation-delay:${(k%7)*0.09}s"></i>`).join("")}</div>` : "";
  go(`<section class="card ${party?"celebrate":""}" ${party?"":"style=\"align-items:flex-start\""}>${burst}
    <p class="small muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">${isBoss?"Final":"Level "+(unitI+1)} · ${esc(unit.name)} · Final score</p>
    ${party?`<div class="big">${art(isBoss?"boss":id,150)}</div>`:""}
    <h1 style="font-size:56px;line-height:1">${qset.right} / ${qset.qs.length}</h1>
    ${starsHTML(id)}
    ${rankUp?`<span class="pill" style="background:var(--accent);color:var(--accent-ink)">New rank: ${esc(rk.r.name)}</span>`:""}
    ${unlockHTML}
    <p id="dmsg">${sayHTML(`${qset.right} out of ${qset.qs.length}. ${msg}${unlockSay}`)}</p>
    <div class="row">${listenBtn("Hear it","hearDone")}</div>
    <div class="row">${unlockHTML&&!isBoss?`<button class="btn go" id="nextLv">Play next level</button>`:""}<button class="btn ${unlockHTML?"":"go"}" id="again">Run it back</button>${isBoss?"":`<button class="btn" id="relearn">Review the lesson</button>`}<button class="btn" id="homeB">Season map</button><button class="btn" id="subB">All subjects</button></div>
  </section>`);
  if (party) SFX.win();
  syncNow();
  $("hearDone").onclick = e => speakEl($("dmsg"), e.currentTarget);
  $("again").onclick = () => isBoss ? openUnit(UNITS.length) : startPractice();
  if ($("relearn")) $("relearn").onclick = () => { slideI = 0; learn(); };
  if ($("nextLv")) $("nextLv").onclick = () => openUnit(bossOpen() && unitI === UNITS.length-1 ? UNITS.length : unitI+1);
  $("homeB").onclick = home; $("subB").onclick = subjects;
  if (S.auto || party) setTimeout(() => $("hearDone") && $("hearDone").click(), 700);
}

/* ---------- settings ---------- */
$("setBtn").onclick = () => { $("settings").hidden = !$("settings").hidden; };
function paintSpeed(){ document.querySelectorAll("#speed button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === S.rate))); }
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => { S.rate = +b.dataset.r; save(); paintSpeed(); speak("This is how fast I'll read."); });
$("auto").checked = !!S.auto; $("auto").onchange = e => { S.auto = e.target.checked; save(); };
$("sfx").checked = S.sfx !== false; $("sfx").onchange = e => { S.sfx = e.target.checked; save(); if (S.sfx) SFX.ok(); };
$("voice").onchange = e => { S.voice = e.target.value; voice = voices.find(v => v.name === S.voice) || voice; save(); speak("Hi Bayo. This is my voice."); };
$("testVoice").innerHTML = `${SPK}<span>Test the voice</span>`; $("testVoice").onclick = e => speak("Hi Bayo. Let's get to work.", null, e.currentTarget);
if (![0.75,0.9,1.1].includes(S.rate)) S.rate = 0.9;
paintSpeed(); paintBoard(); if (!Array.isArray(S.miss)) S.miss = []; setSub(S.sub || "gr"); subjects(); setTimeout(syncNow, 1500);
</script>
</body>
</html>
